      if (b === hookBlock || b.TYPE !== HOOKBLOCK || !b.filename || b.hooks) continue;
      if (depth > 8) continue;                       // 自己包自己的話別無限遞迴
      const src = library.has(b.filename) ? library.get(b.filename) : fileRead(b.filename);
      if (src == null) { missing.push(b.filename); continue; }
      let shell;
      try { shell = cloneScope(makeCustomBlock(src, b.filename)).blocks[0]; }
      catch (e) { missing.push(b.filename); continue; }
      for (const w of shell.hooks[0].wires) {        // load.c:604 ID==1 換成 newnode
        if (w.StartBlockP === shell) w.StartBlockP = b;
        if (w.EndBlockP === shell) w.EndBlockP = b;
      }
      b.hooks = shell.hooks;
      b.bap.IONodeLLHead = shell.bap.IONodeLLHead;   // load.c:601 接腳搶過來
    }
  }
  fillCustomBlocks(root.blocks, 0);

  resolve(root, null);
  linkParents(root.blocks);

  /* block.c:132「跳過暗線段」：最外層的 HOOKBLOCK 是這個存檔當成自訂元件
     時的外框，畫面上不顯示它，接到它身上的線段也不畫。 */
  const blocks = root.blocks.filter(b => b !== hookBlock);
  const wires = root.wires.filter(w => w.StartBlockP !== hookBlock && w.EndBlockP !== hookBlock);
  // allWires 保留暗線段，載成自訂元件時要靠它把接腳接到內部元件
  return { blocks, wires, hookBlock, allWires: root.wires, missing };
}

/* ==========================================================================
   寫存檔 — 對應 Src/save.c

   格式跟讀檔是同一套（見上面 parseSave）。比較不直覺的是存檔前要先在
   最外層的 HOOKBLOCK 上「長出」IO 點和暗線段：這個存檔將來被別的圖當成
   自訂元件載入時，那些 IO 點就是它對外的接腳。
   ========================================================================== */

// save.c:271 / :290 —— 數一數圖裡有幾個控制鈕、幾個顯示器（迴圈內的也算）
function countIO(blocks, wanted) {
  let n = 0;
  for (const b of blocks) {
    const id = b.bap.BITMAPID;
    if (wanted === 'in' && (id === B.CTRLU8BLOCKBitmap || id === B.LOGICCTRLBitmap)) n++;
    if (wanted === 'out' && (id === B.INDICATOR8BLOCKBitmap || id === B.LOGICINDICATORBitmap)) n++;
    if (id === B.FORLOOPBitmap || id === B.WHILELOOPBitmap) {
      if (b.hooks) n += countIO(b.hooks[0].blocks, wanted);
    }
  }
  return n;
}

/* save.c:310 / :366 FindInputNode / FindOutputNode
   在 hook block 上長出接腳，並拉一條「暗線段」連到對應的控制鈕／顯示器。
   接腳沿著 32 像素高平均分配，輸入靠左半、輸出靠右半。 */
function buildHookNodes(hookBlock, blocks, wanted, state) {
  const total = countIO(blocks, wanted);
  const latticeY = total ? Math.floor(32 / total) : 0;
  let idx = 0;

  const walk = bs => {
    for (const b of bs) {
      const id = b.bap.BITMAPID;
      const isIn = wanted === 'in' && (id === B.CTRLU8BLOCKBitmap || id === B.LOGICCTRLBitmap);
      const isOut = wanted === 'out' && (id === B.INDICATOR8BLOCKBitmap || id === B.LOGICINDICATORBitmap);
      if (isIn || isOut) {
        const node = {
          ID: state.ioid++, TYPE: wanted === 'in' ? 1 : 0, NotReady: false, BYTES: 2, value: 0,
          TL: { x: wanted === 'in' ? 0 : 16, y: idx * latticeY },
          EXT: { x: 16, y: latticeY },
        };
        hookBlock.bap.IONodeLLHead.push(node);
        state.wires.push({
          StartBlockP: hookBlock, StartNodeP: node,
          EndBlockP: b, EndNodeP: b.bap.IONodeLLHead[0],
        });
        idx++;
      }
      if (id === B.FORLOOPBitmap || id === B.WHILELOOPBitmap) {
        if (b.hooks) walk(b.hooks[0].blocks);
      }
    }
  };
  walk(blocks);
}

// save.c:36 DataStruct2ASCII
function serializeSave(sc, filename) {
  const out = [];
  const L = v => out.push(String(v));

  // 最外層的 HOOKBLOCK：ID 一定是 1（load.c:676 靠這個認出它）
  const hookBlock = {
    ID: 1, TYPE: HOOKBLOCK, filename,
    bap: { BITMAPID: B.CUSTOMBLOCKBitmap, XY: { x: 0, y: 0 }, SIZE: { x: 32, y: 32 },
           IONodeLLHead: [], CTRLNodeLLHead: [] },
    pap: null, hooks: null,
  };
  const state = { ioid: 0, wires: [] };
  buildHookNodes(hookBlock, sc.blocks, 'in', state);
  buildHookNodes(hookBlock, sc.blocks, 'out', state);

  // 重編 ID：hook block 是 1，其餘從 2 開始
  const ids = new Map([[hookBlock, 1]]);
  let next = 2;
  const number = bs => {
    for (const b of bs) {
      ids.set(b, next++);
      for (const h of b.hooks || []) number(h.blocks);
    }
  };
  number(sc.blocks);

  function ioNodes(list) {
    if (!list.length) return;
    L('NEWIONODEP');
    for (const n of list) {
      L('ADDIONODE');
      L('ID'); L(n.ID);
      L('TYPE'); L(n.TYPE);
      L('BYTES'); L(n.BYTES || 2);
      L('VALUE'); L(n.value | 0);
      L('TL'); L(n.TL.x); L(n.TL.y);
      L('SIZE'); L(n.EXT.x); L(n.EXT.y);
    }
  }
  function ctrlNodes(list) {
    if (!list || !list.length) return;
    L('NEWCTRLNODEP');
    for (const n of list) {
      L('ADDCTRLNODE');
      L('ID'); L(n.ID);
      L('TL'); L(n.TL.x); L(n.TL.y);
      L('SIZE'); L(n.EXT.x); L(n.EXT.y);
    }
  }
  function node(b) {
    L('NEWNODE');
    L('ID'); L(ids.get(b));
    L('TYPE'); L(b.TYPE);
    L('NEWBAP');
    L('BITMAPID'); L(b.bap.BITMAPID);
    L('XY'); L(b.bap.XY.x); L(b.bap.XY.y);
    L('SIZE'); L(b.bap.SIZE.x); L(b.bap.SIZE.y);
    ioNodes(b.bap.IONodeLLHead);
    ctrlNodes(b.bap.CTRLNodeLLHead);
    L('ENDBAP');
    if (b.pap) {
      L('NEWPAP');
      L('BITMAPID'); L(b.pap.BITMAPID);
      L('XY'); L(b.pap.XY.x); L(b.pap.XY.y);
      L('SIZE'); L(b.pap.SIZE.x); L(b.pap.SIZE.y);
      ctrlNodes(b.pap.CTRLNodeLLHead);
      L('ENDPAP');
    }
    if (b.TYPE === LOOPBLOCK && b.hooks) {      // save.c:202 迴圈只有一個 hook
      L('NEWLOOPHOOK');
      L('NEWHOOK');
      body(b.hooks[0]);
    }
    if (b.TYPE === CASEBLOCK && b.hooks) {      // save.c:209 case 有一串
      L('NEWCASEHOOK');
      for (const h of b.hooks) { L('NEWHOOK'); body(h); }
    }
    if (b.filename) { L('FILENAME'); L(b.filename); }
    L('ENDNODE');
  }
  function body(scope) {
    L('STARTBLOCK');
    for (const b of scope.blocks) node(b);
    L('ENDBLOCK');
    L('STARTWIRE');
    for (const w of scope.wires) {
      L('STARTBID'); L(ids.get(w.StartBlockP));
      L('STARTNID'); L(w.StartNodeP.ID);
      L('ENDBID'); L(ids.get(w.EndBlockP));
      L('ENDNID'); L(w.EndNodeP.ID);
    }
    L('ENDWIRE');
  }

  // 最外層：hook block 排第一，暗線段跟著頂層線段一起寫出去
  body({ blocks: [hookBlock, ...sc.blocks], wires: [...state.wires, ...sc.wires] });
  return out.join('\n') + '\n';
}

// 最小的 PDB 容器，跟 tools/make_sample_pdb.py 寫的是同一套
function textToPdb(name, text) {
  const enc = s => Uint8Array.from([...s].map(c => c.charCodeAt(0) & 0xff));
  const hdr = new Uint8Array(78);
  hdr.set(enc(name.slice(0, 31)), 0);
  const dv = new DataView(hdr.buffer);
  const now = Math.floor(Date.now() / 1000) + 2082844800;   // Palm 的原點是 1904
  dv.setUint32(36, now); dv.setUint32(40, now);
  hdr.set(enc('save'), 60); hdr.set(enc('wjfx'), 64);
  dv.setUint16(76, 1);                                       // numRecords
  const entry = new Uint8Array(8);
  new DataView(entry.buffer).setUint32(0, 78 + 8 + 2);
  entry[7] = 1;
  const payload = enc(text);
  const out = new Uint8Array(78 + 8 + 2 + payload.length);
  out.set(hdr, 0); out.set(entry, 78); out.set(payload, 88);
  return out;
}

function saveFile() {
  const name = (prompt('存檔名稱', 'untitled') || '').trim();
  if (!name) return;
  const text = serializeSave(scene, name);
  const blob = new Blob([textToPdb(name, text)], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name + '.pdb';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  const st = document.getElementById('status');
  st.textContent = `存成 ${name}.pdb（${text.split('\n').length} 行）`;
  st.className = 'ok';
}

/* ==========================================================================
   自訂元件 — 對應 Src/load.c:755 ProcessCUSTOMLoad 與
   Src/functions.c:515 AddCUSTtoSYSHOOK

   一個存好的 .pdb 可以被另一張圖當成單一元件用。檔案裡最外層的 HOOKBLOCK
   就是那顆元件的外殼，它的接腳（存檔時長出來的）透過暗線段連到內部的
   控制鈕與顯示器 —— 也就是這顆元件的輸入和輸出。

   原版是照檔名去 Palm 的資料庫裡找（load.c:589 遞迴呼叫 LOAD）。瀏覽器
   不能憑檔名讀本機檔案，所以改成「元件庫」：載進來的 .pdb 留一份原文，
   要用的時候再複製一份實例化。
   ========================================================================== */

const library = new Map();   // filename -> 存檔原文

// 深拷貝一份場景，讓同一個元件可以放很多顆而不會互相干擾
function cloneScope(scope) {
  const map = new Map();
  const cloneNode = n => {
    if (!map.has(n)) map.set(n, { ...n, TL: { ...n.TL }, EXT: { ...n.EXT } });
    return map.get(n);
  };
  const cloneBlock = b => {
    if (map.has(b)) return map.get(b);
    const nb = {
      ...b,
      bap: {
        ...b.bap,
        XY: { ...b.bap.XY }, SIZE: { ...b.bap.SIZE },
        IONodeLLHead: b.bap.IONodeLLHead.map(cloneNode),
        CTRLNodeLLHead: (b.bap.CTRLNodeLLHead || []).map(c => ({ ...c, TL: { ...c.TL }, EXT: { ...c.EXT } })),
      },
      pap: b.pap ? {
        ...b.pap, XY: { ...b.pap.XY }, SIZE: { ...b.pap.SIZE },
        CTRLNodeLLHead: (b.pap.CTRLNodeLLHead || []).map(c => ({ ...c, TL: { ...c.TL }, EXT: { ...c.EXT } })),
      } : null,
      hooks: null,
    };
    map.set(b, nb);
    if (b.hooks) nb.hooks = b.hooks.map(h => ({ name: h.name, blocks: h.blocks.map(cloneBlock), wires: [] }));
    return nb;
  };
  const cloneWire = w => ({
    ...w,
    StartBlockP: cloneBlock(w.StartBlockP), StartNodeP: cloneNode(w.StartNodeP),
    EndBlockP: cloneBlock(w.EndBlockP), EndNodeP: cloneNode(w.EndNodeP),
    RUNPOINT: { x: 0, y: 0 },
  });
  const walk = (src, dst) => {
    dst.wires = src.wires.map(cloneWire);
    src.blocks.forEach((b, i) => {
      const nb = map.get(b);
      (b.hooks || []).forEach((h, j) => walk(h, nb.hooks[j]));
    });
  };
  const out = { blocks: scope.blocks.map(cloneBlock), wires: [] };
  walk(scope, out);
  return out;
}

/* load.c:762 —— 檔案裡的 HOOKBLOCK 變成元件外殼，其餘方塊和「全部」線段
   （含暗線段）都收進它的 hook 裡。 */
function makeCustomBlock(text, name) {
  const parsed = parseSave(text);
  if (!parsed.hookBlock) throw new Error('這個檔案沒有 HOOKBLOCK 外框，不能當成元件');

  const hb = parsed.hookBlock;
  hb.TYPE = HOOKBLOCK;
  hb.bap.BITMAPID = B.CUSTOMBLOCKBitmap;   // functions.c:520
  hb.bap.XY = { x: 10, y: 20 };
  hb.bap.SIZE = { x: 32, y: 32 };
  hb.filename = name;
  hb.hooks = [{ name: null, blocks: parsed.blocks, wires: parsed.allWires }];
  return { blocks: [hb], wires: [] };
}

function addCustomToScene(name) {
  const text = library.get(name);
  if (!text) return;
  const proto = makeCustomBlock(text, name);
  const copy = cloneScope(proto);
  const b = copy.blocks[0];
  b.ID = nextId++;
  b.parent = null;
  scene.blocks.push(b);
  linkParents(scene.blocks);
  resetRun();
  selected = b;
  b.bap.DrawBorder = true;
  const ins = b.bap.IONodeLLHead.filter(n => n.TYPE === 1).length;
  const outs = b.bap.IONodeLLHead.filter(n => n.TYPE === 0).length;
  runStatus(`加入自訂元件 "${name}"（${ins} 進 ${outs} 出），用手工具拖到想要的位置`);
  render();
}

function renderLibrary() {
  const el = document.getElementById('lib');
  if (!library.size) { el.innerHTML = '<span class="hint">還沒有元件。載入 .pdb 時勾「當成元件」就會收進這裡。</span>'; return; }
  el.innerHTML = [...library.keys()]
    .map(n => `<button type="button" data-lib="${esc(n)}">${esc(n)}</button>`).join(' ');
  el.querySelectorAll('button').forEach(btn =>
    btn.addEventListener('click', () => addCustomToScene(btn.dataset.lib)));
}

async function loadFile(file) {
  const status = document.getElementById('status');
  try {
    const text = pdbToText(await file.arrayBuffer());
    const name = file.name.replace(/\.pdb$/i, '');

    // 當成元件：收進元件庫，不動目前的圖
    if (document.getElementById('asComponent').checked) {
      makeCustomBlock(text, name);          // 先驗證讀得動
      library.set(name, text);
      fileWrite(name, text);                // 元件本身也是一個存檔，之後靠檔名找得回來
      renderLibrary();
      status.textContent = `"${name}" 已加入元件庫，點一下就能放進圖裡`;
      status.className = 'ok';
      return;
    }

    const parsed = parseSave(text);
    fileWrite(name, text);   // 等同原版 HotSync 把 .pdb 放進機器裡，LOADForm 才看得到
    killTimer(); RUN = 0; STOP = 0;
    ticks = 0;
    scene = parsed;
    selected = null;
    resetRun();
    syncUI();
    const n = (bs) => bs.reduce((s, b) => s + 1 + (b.hooks || []).reduce((t, h) => t + n(h.blocks), 0), 0);
    status.textContent = `${file.name}：${n(scene.blocks)} 個元件、${scene.wires.length} 條線段`
      + (parsed.hookBlock ? `（外框 HOOKBLOCK "${parsed.hookBlock.filename || '?'}" 未顯示）` : '')
      + (parsed.missing && parsed.missing.length
          ? `　⚠ 找不到自訂元件 ${[...new Set(parsed.missing)].map(x => `"${x}"`).join('、')}`
            + '，它們會是空殼。先把那個元件的 .pdb 匯入（勾「當成元件加入」）再載這張圖。'
          : '');
    status.className = parsed.missing && parsed.missing.length ? 'err' : 'ok';
  } catch (err) {
    status.textContent = '讀取失敗：' + err.message;
    status.className = 'err';
  }
}

/* ========================= 互動 ========================= */
// misc.c:477 IsInArea 的簡化版：由後往前找（後畫的在上層）
function hitTest(blocks, px, py, wx = 0, wy = 0) {
  for (let i = blocks.length - 1; i >= 0; i--) {
    const b = blocks[i];
    const x = b.bap.XY.x + wx, y = b.bap.XY.y + wy;
    for (const h of b.hooks || []) {
      if (b.TYPE === CASEBLOCK && h !== b.hooks[b.CurrentHOOK]) continue;
      const inner = hitTest(h.blocks, px, py, x, y);
      if (inner) return inner;
    }
    if (px >= x && px < x + b.bap.SIZE.x && py >= y && py < y + b.bap.SIZE.y) return b;
  }
  return null;
}

/* misc.c:477 IsInArea —— 拖曳中的元件落在哪個「結構」上（迴圈 / switch case）。
   由內往外找最深的那一個；手上抓的那顆和它自己的子孫都要排除，
   否則會把元件搬進自己裡面。落在空白處就是回到主串列（SYSHOOK）。 */
function isDescendant(b, anc) { for (let p = b; p; p = p.parent) if (p === anc) return true; return false; }

/* 迴圈自己長出來的預設元件：for 的 N / I，while 的條件。它們是結構的一部分，
   不是使用者放進去的東西 —— 原版 block.c:2056 的手工具整段包在
   `InAreaInf.llp->TYPE != CTRLBLOCK` 底下，也就是根本抓不起來。網頁版放寬成
   「可以在自己的框裡搬位置，但不准離開」：N 就貼在迴圈左邊框上，往左一點就
   掉到框外面，一放手 reparent 會把它搬出迴圈**並且拆掉它的線**
   （block.c:1766 ChangeLinkList 搬串列前先 BreakWireConnection），
   迴圈就此失去 N，永遠等不到計數上限。 */
function isLoopDefault(b) {
  return b.TYPE === CTRLBLOCK && b.parent && b.parent.TYPE === LOOPBLOCK;
}
function structAt(blocks, px, py, moving, wx = 0, wy = 0) {
  for (let i = blocks.length - 1; i >= 0; i--) {
    const b = blocks[i];
    if (b === moving) continue;
    const x = b.bap.XY.x + wx, y = b.bap.XY.y + wy;
    if (!(px >= x && px < x + b.bap.SIZE.x && py >= y && py < y + b.bap.SIZE.y)) continue;
    if (b.TYPE !== LOOPBLOCK && b.TYPE !== CASEBLOCK) continue;
    const h = b.hooks[b.TYPE === CASEBLOCK ? b.CurrentHOOK : 0];
    // 先往裡面找更深的結構（IsInArea 的遞迴），沒有才用自己
    const inner = structAt(h.blocks, px, py, moving, x, y);
    return inner || b;
  }
  return null;
}

/* block.c:1766 ChangeLinkList —— 放手時，元件所屬的串列跟著落點換。
   原版是先 BreakWireConnection 再搬串列；座標要從絕對值換算成
   相對於新父層的值（block.c:1789 的那段迴圈）。 */
function reparent(b, newParent) {
  const oldParent = b.parent || null;
  if (newParent === oldParent) return;
  const abs = absOrigin(b);
  const ax = abs.x + b.bap.XY.x, ay = abs.y + b.bap.XY.y;

  removeBlock(scene, b);                       // 拆線 + 從原串列移除
  const dest = newParent
    ? newParent.hooks[newParent.TYPE === CASEBLOCK ? newParent.CurrentHOOK : 0]
    : scene;
  dest.blocks.push(b);
  b.parent = newParent;
  const no = absOrigin(b);
  b.bap.XY.x = Math.max(0, ax - no.x);
  b.bap.XY.y = Math.max(0, ay - no.y);
  linkParents(scene.blocks);
  itemMoveToLast(b);                           // block.c:2720
  resetRun();
}

/* linklist.c:653 ItemMoveToLastPosition + misc.c:410 NestItemMoveToLastPosition
   點到的元件移到所屬串列的最後面，畫的時候就會蓋在最上面（拿到最大 Z）。
   巢狀的話連它的上層也要一路往後移，不然整個結構還是被別人蓋住。 */
function itemMoveToLast(b) {
  for (let cur = b; cur; cur = cur.parent) {
    const arr = scopeOf(cur).blocks;
    const i = arr.indexOf(cur);
    if (i >= 0 && i !== arr.length - 1) { arr.splice(i, 1); arr.push(cur); }
  }
}

function canvasPos(ev) {
  const r = cv.getBoundingClientRect();
  return {
    x: Math.floor((ev.clientX - r.left) / (r.width / cv.width)),
    y: Math.floor((ev.clientY - r.top) / (r.height / cv.height)),
  };
}

let drag = null;     // {block, dx, dy}
let resize = null;   // {block, ox, oy} —— DRAG 工具改結構元件大小
let panelDrag = null;// {block, dx, dy} —— 前面板的手工具（panel.c:534）

cv.addEventListener('pointerdown', ev => {
  const { x: px, y: py } = canvasPos(ev);

  // 選單和 AboutForm 在最上層（Palm 的選單會蓋掉整個 form）
  if (menuPenDown(px, py)) return;
  // SAVEForm / LOADForm 是 modal，開著就什麼都不放行
  if (dialogPenDown(px, py)) return;

  // 彈出視窗在下一層，先攔
  if (popup) {
    const hit = popupHit(px, py);
    if (hit === -2) { popup = null; render(); return; }       // 點視窗外就關掉
    if (hit === -1) { render(); return; }
    if (popup.kind === 'tools') {
      pointerStateSet(popupItems()[hit].bmp);
      wireStart = null;
      popup = null;
      keyboardObject = null;                 // panel.c:525 碰工具列就收掉鍵盤
      runStatus('工具：' + (SPRITES[pointerStateGet()] || {}).n);
    } else if (popup.cat === null) {
      /* functions.c:1005 FUNCCUST 這一格不是元件格，是「自訂元件」的入口：
         設 CUSTOMLOAD=true 然後開 LOADForm，選到的檔案會被當成元件加進圖裡。 */
      if (PALETTE[hit].name === 'FUNCCUST') {
        popup = null;
        dialog = { kind: 'load', names: fileList(), sel: 0, custom: true };
      } else if (PALETTE[hit].items.length) popup = { kind: 'functions', cat: hit };
      else runStatus(PALETTE[hit].name.replace('FUNC', '') + ' 這個分類當年沒做完，是空的');
    } else {
      const b = addToSysHook(PALETTE[popup.cat].items[hit]);
      popup = null;
      selected = b;
      b.bap.DrawBorder = true;
      runStatus(`加入 #${b.ID} ${(SPRITES[b.bap.BITMAPID] || {}).n}，用手工具拖到想要的位置`);
    }
    render();
    return;
  }

  // 工具列在畫面裡面，所以要先攔（block.c:1934）
  const tool = toolbarHit(px, py);
  if (tool) {
    if (tool === 'run') runButton();
    else if (tool === 'stop') stopButton();
    else if (tool === 'lamp') lampButton();
    else if (tool === 'forever') foreverButton();
    else if (tool === 'title') {
      view = view === 'panel' ? 'block' : 'panel';   // 點標題就換 form
      keyboardObject = null;
      render();
    }
    else if (tool === 'functions') { popup = { kind: 'functions', cat: null }; render(); }
    else { popup = { kind: 'tools' }; render(); }
    return;
  }

  /* panel.c:533 PanelpenDownProcess —— 前面板的三個工具各做各的事：
     HAND 搬位置、FINGER 操作控制項、PENCIL 叫數字鍵盤。 */
  if (view === 'panel') {
    if (selected) { selected.bap.DrawBorder = false; if (selected.pap) selected.pap.DrawBorder = false; }
    const hit = panelHit(scene.blocks, px, py);

    if (pointerStateGet() === B.HANDBitmap) {
      // panel.c:534 抓住面板物件搬位置。面板座標是絕對值（panel.c:257），
      // 所以 setNewObjXY 在 FrontPanelForm 這一支直接寫 pap->XY，不扣父層位移。
      stopForEdit();                                      // panel.c:536 執行中不可編輯
      keyboardObject = null;
      selected = hit ? hit.block : null;
      if (hit) {
        hit.block.pap.DrawBorder = true;
        panelDrag = { block: hit.block, dx: px - hit.block.pap.XY.x, dy: py - hit.block.pap.XY.y };
        cv.setPointerCapture(ev.pointerId);
        runStatus(`搬 #${hit.block.ID} 的面板位置`);
      } else runStatus('手：要抓在面板上的元件');
      render();
      return;
    }

    if (pointerStateGet() === B.PENCILBitmap) {
      // panel.c:588 鍵盤開著的時候，筆點先給鍵盤（misc.c:929 KeyboardPendownProcess）
      if (keyboardHit(px, py)) { render(); return; }
      selected = hit ? hit.block : null;
      if (hit) {
        hit.block.pap.DrawBorder = true;
        // panel.c:617 只有 CTRLU8Bitmap 會叫出鍵盤
        if (hit.block.pap.BITMAPID === B.CTRLU8Bitmap) {
          keyboardObject = keyboardObject === hit.block ? null : hit.block;
          keyboardText = '';
          runStatus(keyboardObject ? '數字鍵盤：打完按 E 送出、c 清除' : '');
        }
      } else keyboardObject = null;
      render();
      return;
    }

    // panel.c:561 FINGER：按在控制點上就改值（panel.c:367 ChangeControl）
    keyboardObject = null;
    selected = hit ? hit.block : null;
    if (hit) {
      hit.block.pap.DrawBorder = true;
      if (hit.node) changeControl(hit.block, hit.node);
    }
    render();
    return;
  }

  // 接線工具：在節點上按下、拖到另一個節點放開（block.c:1591 的 WireStart/WireStop）
  if (pointerStateGet() === B.THREADBitmap) {
    stopForEdit();
    const n = nodeHit(scene.blocks, px, py);
    wireStart = n;
    penPos = { x: px, y: py };
    if (n) {
      cv.setPointerCapture(ev.pointerId);
      runStatus(`接線：從 #${n.block.ID} 的 ${n.node.TYPE ? 'in' : 'out'}[${n.node.ID}] 拉到另一個節點`);
    } else runStatus('接線：要從 IO 節點上開始拉');
    render();
    return;
  }

  // DRAG 工具：拉右下角改大小，或翻 switch case 的頁（block.c:2151）
  if (pointerStateGet() === B.DRAGBitmap) {
    stopForEdit();
    const hit = ctrlHit(scene.blocks, px, py);
    if (!hit) { runStatus('拖拉：要點在結構元件的控制點上'); render(); return; }
    itemMoveToLast(hit.block);                 // block.c:2163
    if (hit.node.ID === 1 /*DRAGNODE*/) {
      const o = absOrigin(hit.block);
      resize = { block: hit.block, ox: o.x + hit.block.bap.XY.x, oy: o.y + hit.block.bap.XY.y };
      cv.setPointerCapture(ev.pointerId);
    } else if (hit.node.ID === 2 /*SCPAGEUP*/) {
      hit.block.CurrentHOOK = (hit.block.CurrentHOOK + 1) % hit.block.hooks.length;
      runStatus(`switch case → "${hit.block.hooks[hit.block.CurrentHOOK].name}"`);
    } else if (hit.node.ID === 3 /*SCPAGEDOWN*/) {
      const n2 = hit.block.hooks.length;
      hit.block.CurrentHOOK = (hit.block.CurrentHOOK - 1 + n2) % n2;
      runStatus(`switch case → "${hit.block.hooks[hit.block.CurrentHOOK].name}"`);
    }
    render();
    return;
  }

  // 剪刀：剪掉一條線段
  if (pointerStateGet() === B.SCISSORBitmap) {
    stopForEdit();
    const hit = wireHit(scene, px, py);
    if (hit) {
      hit.scope.wires.splice(hit.scope.wires.indexOf(hit.wire), 1);
      resetRun();
      runStatus('剪掉一條線段');
    } else runStatus('剪刀：要點在線段上');
    render();
    return;
  }

  // 刪除工具
  if (pointerStateGet() === B.KILLBitmap) {
    stopForEdit();
    const b = hitTest(scene.blocks, px, py);
    if (b) {
      removeBlock(scene, b);
      if (selected === b) selected = null;
      runStatus(`刪掉 #${b.ID}`);
    } else runStatus('刪除：要點在元件上');
    render();
    return;
  }

  if (selected) selected.bap.DrawBorder = false;
  selected = hitTest(scene.blocks, px, py);
  if (selected) {
    selected.bap.DrawBorder = true;
    // block.c:2056 「凡落在範圍內的元件移到串列最後面」，5-30 跳開預設元件
    if (selected.TYPE !== CTRLBLOCK) itemMoveToLast(selected);
    // 手工具才能拖。座標是相對於元件所屬的層，所以要扣掉父層的位移
    if (pointerStateGet() === B.HANDBitmap) {
      stopForEdit();
      const o = absOrigin(selected);
      drag = { block: selected, dx: px - o.x - selected.bap.XY.x, dy: py - o.y - selected.bap.XY.y,
               bg: selected.parent || null };
      cv.setPointerCapture(ev.pointerId);
    }
  }
  render();
});

cv.addEventListener('pointermove', ev => {
  /* panel.c:662 + misc.c:791 setNewObjXY(now_x - RelativePoint, now_y - RelativePoint)。
     CaculateNowXNowY 的夾限換算過來就是 x 不能小於 0、y 不能上到標題列裡面。 */
  if (panelDrag) {
    const { x: px, y: py } = canvasPos(ev);
    panelDrag.block.pap.XY.x = Math.max(0, px - panelDrag.dx);
    panelDrag.block.pap.XY.y = Math.max(15, py - panelDrag.dy);
    render();
    return;
  }
  // 拉線中：把筆下的節點反白（block.c:2615 CheckOnNode）
  if (wireStart) {
    const { x: px, y: py } = canvasPos(ev);
    penPos = { x: px, y: py };
    const n = nodeHit(scene.blocks, px, py);
    hoverNode = n && n.node !== wireStart.node && n.block !== wireStart.block &&
                !(effectiveType(wireStart, n) === 0 && effectiveType(n, wireStart) === 0) ? n : null;
    render();
    return;
  }
  if (resize) {
    const { x: px, y: py } = canvasPos(ev);
    // 結構元件不能小到裝不下裡面的東西，給一個下限
    resize.block.bap.SIZE.x = Math.max(24, px - resize.ox + 1);
    resize.block.bap.SIZE.y = Math.max(24, py - resize.oy + 1);
    relocateCtrlNodes(resize.block);
    render();
    return;
  }
  if (!drag) return;
  const { x: px, y: py } = canvasPos(ev);
  const o = absOrigin(drag.block);
  // misc.c:800 PointIconYExt：筆點被夾在 18 以下，拖不到工具列上面去
  drag.block.bap.XY.x = Math.max(0, px - o.x - drag.dx);
  drag.block.bap.XY.y = Math.max(TOOLBAR_H - o.y, py - o.y - drag.dy);
  /* 迴圈的預設元件（N、I、while 的條件）不准離開自己的結構 —— 見 pointerup。
     位置夾在父層的框裡面，不然會被拖到框外面、看起來像已經搬出去了。 */
  if (isLoopDefault(drag.block)) {
    const p = drag.block.parent, sz = drag.block.bap.SIZE;
    drag.block.bap.XY.x = Math.min(Math.max(0, drag.block.bap.XY.x), Math.max(0, p.bap.SIZE.x - sz.x));
    drag.block.bap.XY.y = Math.min(Math.max(0, drag.block.bap.XY.y), Math.max(0, p.bap.SIZE.y - sz.y));
    render();
    return;
  }
  /* block.c:2402 落在結構上就把那個結構框起來，放手時搬進去 */
  const bg = structAt(scene.blocks, px, py, drag.block);
  if (bg !== drag.bg) {
    if (drag.bg && drag.bg !== selected) drag.bg.bap.DrawBorder = false;
    drag.bg = bg;
    if (bg) bg.bap.DrawBorder = true;
  }
  render();
});

cv.addEventListener('pointerup', ev => {
  if (panelDrag) { panelDrag = null; render(); return; }   // panel.c:742 放手就放開
  if (resize) { relocateCtrlNodes(resize.block); resize = null; render(); return; }

  // 接線：在另一個節點上放開才算數（block.c:1591）
  if (wireStart) {
    const { x: px, y: py } = canvasPos(ev);
    const n = nodeHit(scene.blocks, px, py);
    if (!n || n.node === wireStart.node) {
      runStatus('接線取消');
    } else if (n.block === wireStart.block) {
      // block.c:1593 起終點不能是同一個元件
      runStatus('接線失敗：兩端不能是同一個元件');
    } else if (effectiveType(wireStart, n) === 0 && effectiveType(n, wireStart) === 0) {
      // block.c:1582 兩個輸出不能接在一起
      runStatus('接線失敗：輸出不能接輸出');
    } else {
      addWire(wireStart, n);
      runStatus(`接好 #${wireStart.block.ID} → #${n.block.ID}`);
    }
    wireStart = null;
    hoverNode = null;
    penPos = null;
    render();
  }
  if (drag) {
    const bg = drag.bg || null;
    if (bg && bg !== selected) bg.bap.DrawBorder = false;
    if (isLoopDefault(drag.block)) {
      drag = null; render(); return;            // 預設元件只能在自己的框裡動
    }
    if (bg !== (drag.block.parent || null) && !(bg && isDescendant(bg, drag.block))) {
      reparent(drag.block, bg);
      runStatus(bg ? `#${drag.block.ID} 搬進 #${bg.ID} 裡面` : `#${drag.block.ID} 回到最外層`);
    }
    drag = null;
    render();
    return;
  }
  drag = null;
});

cv.addEventListener('pointercancel', () => { drag = null; resize = null; panelDrag = null; wireStart = null; hoverNode = null; penPos = null; });



/* ========================= 執行的驅動 =========================
   block.c:3096 的 nilEvent 迴圈：RUN==1 的時候每個 event 跑一次 DoRun，
   回傳 false 就代表跑完了 —— RUNFOREVER 開著就重置狀態再來一輪，
   否則把 RUN 歸零。這裡用 setInterval 代替 Palm 的 nilEvent。 */
// mbcwjfx.c:63  STOP: 0=無用 1=可用 2=停止（2 從來沒被指派過，是個死狀態）
// mbcwjfx.c:98  RUN:  0=靜止 1=執行 2=暫停
let RUN = 0, STOP = 0, RUNFOREVER = false, ticks = 0, timer = null;
/* mbcwjfx.c:69 —— 原版是兩個獨立的公共變數 BlockPointerState 和
   PanelPointerState，兩個 form 各記各的工具，切過去不會互相影響。
   之前這裡只有一個變數，所以在前面板選了工具再切回方塊圖會帶過去，
   反過來也會讓前面板拿到 THREAD 之類根本不屬於它的工具。 */
let blockPointerState = B.HANDBitmap;
let panelPointerState = B.HANDBitmap;
function pointerStateGet() { return view === 'panel' ? panelPointerState : blockPointerState; }
function pointerStateSet(v) { if (view === 'panel') panelPointerState = v; else blockPointerState = v; }
const MAX_TICKS = 50000;   // 保險絲：接錯線的圖有可能永遠跑不完

function runStatus(msg) {
  document.getElementById('runstat').textContent = msg;
}

function startTimer() {
  clearInterval(timer);
  timer = setInterval(tick, 1000 / +document.getElementById('speed').value);
}
function killTimer() { clearInterval(timer); timer = null; }

function resetRun() {
  const clear = bs => { for (const b of bs) { b.bap.NoInput = false; for (const h of b.hooks || []) clear(h.blocks); } };
  clear(scene.blocks);
  checkConnection(scene.blocks, false);
  resetWireStatus(scene.blocks, scene.wires);
}

// 工具列圖示、HTML 按鈕、畫面三者都吃同一份狀態
function syncUI() {
  document.getElementById('run').textContent = RUN === 1 ? '暫停' : RUN === 2 ? '繼續' : '執行';
  document.getElementById('stop').disabled = STOP !== 1;
  document.getElementById('lamp').checked = LAMP;
  document.getElementById('forever').checked = RUNFOREVER;
  render();
}

/* 原版沒有這個。DoRun_HOOKBLOCK（run.c:781）和 DoRun_LOOPBLOCK 在「輸入還沒
   到齊」時是回傳 handle=true 的，所以一張永遠等不到輸入的圖（接腳沒接線、或
   自訂元件的暗線段缺了）會無止盡空轉 —— 原版就是這樣，要使用者自己按 STOP。
   網頁版多一道熄火：連續這麼多個 tick 整個執行狀態都沒變，就當作卡住了，
   停下來並說明原因，不然畫面上看起來只是「跑不完」。 */
/* 缺少輸入的元件 —— 網頁版另外加的錯誤檢查（原版沒有）。

   CheckConnection（run.c 的那支）算 INodeNUM 是「數 TYPE==1 的節點個數」，
   不是「數接上線的節點個數」。所以一顆有輸入節點卻沒接線的元件，INodeNUM
   永遠歸不了零、DoRun_BlockRun 每個 tick 都把 handle 設成 true —— 原版就會
   一直空轉到使用者按 STOP。

   這是圖畫錯了，不是跑得慢，所以要指出來是哪一顆，而不是讓它默默轉。
   刻意不採「沒接線就當 0」的作法：資料流語言裡「沒接線」跟「接了一個 0」
   是兩件事，自動補 0 會把接線漏掉的錯誤變成算錯的答案。 */
function findUnfedInputs() {
  const fed = new Set();
  const walk = sc => {
    for (const w of sc.wires) { fed.add(w.StartNodeP); fed.add(w.EndNodeP); }
    for (const b of sc.blocks) for (const h of b.hooks || []) walk(h);
  };
  walk(scene);
  const bad = [];
  const scan = (sc, path) => {
    for (const b of sc.blocks) {
      const miss = b.bap.IONodeLLHead.filter(n => n.TYPE === 1 && !fed.has(n));
      b.bap.NoInput = miss.length > 0;
      if (miss.length) bad.push({ block: b, miss, path });
      for (const h of b.hooks || []) scan(h, path.concat('#' + b.ID));
    }
  };
  scan(scene, []);
  return bad;
}
function unfedText(bad) {
  return bad.map(u => {
    const where = u.path.length ? `（在 ${u.path.join(' → ')} 裡面）` : '';
    return `#${u.block.ID}${where} 的第 ${u.miss.map(n => n.ID).join('、')} 號輸入`;
  }).join('；');
}

const STALL_TICKS = 64;
let runWarn = '';    // 開跑時就發現的問題，整段執行期間都掛在狀態列上
let stallFingerprint = '', stallCount = 0;
let loopIterations = 0;   // 迴圈總共重跑了幾輪，只給 runFingerprint() 用

function runFingerprint() {
  const out = [];
  const walk = sc => {
    for (const b of sc.blocks) {
      out.push(b.bap.INodeNUM, b.bap.ONodeNUM);
      for (const n of b.bap.IONodeLLHead) out.push(n.NotReady ? 1 : 0, n.value);
      for (const h of b.hooks || []) walk(h);
    }
    for (const w of sc.wires) {
      out.push(w.DIRTY ? 1 : 0, w.RUNSEG, w.RUNPOINT ? w.RUNPOINT.x + ',' + w.RUNPOINT.y : '-');
    }
  };
  walk(scene);
  /* 一個什麼都不做的 while(1) 每個 tick 都會回到一模一樣的狀態，光看狀態
     跟真正的卡住分不出來。迴圈每重跑一輪就把這個計數器加一，讓它算有進展
     —— 那種圖是「照使用者寫的跑到天荒地老」，跟原版一樣，該按停止鈕。 */
  out.push('it' + loopIterations);
  return out.join('|');
}

function tick() {
  const busy = doRun(scene.blocks, scene.wires);
  ticks++;
  if (busy) {
    const fp = runFingerprint();
    if (fp === stallFingerprint) stallCount++; else { stallFingerprint = fp; stallCount = 0; }
    if (stallCount >= STALL_TICKS) {
      killTimer(); RUN = 0; STOP = 0;
      const bad = findUnfedInputs();
      runStatus(bad.length
        ? '停住了（' + ticks + ' ticks）：' + unfedText(bad) + '沒有接線，'
          + '永遠等不到資料，整張圖就結束不了。畫面上已把那些元件框起來。'
        : '卡住了：連續 ' + STALL_TICKS + ' 個 tick 沒有任何進展（' + ticks + ' ticks）。'
          + '通常是自訂元件的接腳沒接上。');
      syncUI();
      return;
    }
    if (ticks >= MAX_TICKS) { killTimer(); RUN = 0; STOP = 0; runStatus(`第 ${ticks} 個 tick 仍未結束，已中止`); }
    else runStatus(`執行中… ${ticks} ticks` + runWarn);
    syncUI();
    return;
  }
  // block.c:3102 跑完了：RUNFOREVER 開著就重置再來一輪，否則停下來
  if (RUNFOREVER) { resetRun(); runStatus(`跑完一輪，重來（${ticks} ticks）`); }
  else { killTimer(); RUN = 0; STOP = 0; runStatus(`結束，共 ${ticks} ticks`); }
  syncUI();
}

// block.c:1970 執行鈕：靜止→執行、執行→暫停、暫停→執行
function runButton() {
  if (RUN === 0) {
    STOP = 1; RUN = 1; ticks = 0; stallFingerprint = ''; stallCount = 0; loopIterations = 0;
    resetRun(); startTimer();
    const shells = [];
    const scan = bs => { for (const b of bs) { if (b.TYPE === HOOKBLOCK && !b.hooks) shells.push(b.filename || ('#' + b.ID)); for (const h of b.hooks || []) scan(h.blocks); } };
    scan(scene.blocks);
    const bad = findUnfedInputs();          // 缺輸入是錯誤，一開跑就講，不必等熄火
    const warn = [];
    if (shells.length) warn.push(`自訂元件 ${[...new Set(shells)].map(x => `"${x}"`).join('、')} 是空殼，找不到內容`);
    if (bad.length) warn.push(`${unfedText(bad)}沒有接線，那些元件不會執行`);
    runWarn = warn.length ? `（⚠ ${warn.join('；')}）` : '';
    runStatus('執行中…' + runWarn);
  }
  else if (RUN === 1) { RUN = 2; killTimer(); runStatus(`暫停於 ${ticks} ticks`); }
  else { RUN = 1; startTimer(); }
  syncUI();
}

// block.c:1958 停止鈕：只有 STOP==1（可用）時才有作用
function stopButton() {
  if (STOP !== 1) return;
  STOP = 0; RUN = 0; RUNFOREVER = false;
  killTimer(); ticks = 0; resetRun();
  runStatus('已停止');
  syncUI();
}

// block.c:1991 一直跑：打開的同時就會開始執行
function foreverButton() {
  RUNFOREVER = !RUNFOREVER;
  if (RUNFOREVER) {
    STOP = 1;
    if (RUN === 0) { RUN = 1; ticks = 0; resetRun(); }
    else RUN = 1;
    startTimer();
  }
  syncUI();
}

function lampButton() {
  LAMP = !LAMP;
  // 執行點一個 tick 只走一像素，開動畫時要把 tick 率拉高才看得順
  const sp = document.getElementById('speed');
  sp.value = LAMP ? 120 : 8;
  document.getElementById('speedv').textContent = sp.value + '/s';
  if (RUN === 1) startTimer();
  syncUI();
}

function stepButton() {
  if (RUN === 1) { RUN = 2; killTimer(); }
  if (ticks === 0) resetRun();
  STOP = 1;
  tick();
  if (RUN !== 1) runStatus(`單步：${ticks} ticks`);
}

document.getElementById('run').addEventListener('click', runButton);
document.getElementById('step').addEventListener('click', stepButton);
document.getElementById('stop').addEventListener('click', stopButton);
document.getElementById('lamp').addEventListener('change', lampButton);
document.getElementById('forever').addEventListener('change', foreverButton);
document.getElementById('speed').addEventListener('input', e => {
  document.getElementById('speedv').textContent = e.target.value + '/s';
  if (RUN === 1) startTimer();
});

/* ========================= 場景切換 ========================= */
function setScene(builder, label) {
  popup = null; wireStart = null; hoverNode = null; penPos = null; drag = null; resize = null; keyboardObject = null;
  menu = null; about = false; panelDrag = null; dialog = null;
  killTimer(); RUN = 0; STOP = 0;
  ticks = 0;
  scene = builder();
  selected = null;
  resetRun();
  syncUI();
  const st = document.getElementById('status');
  st.textContent = label || '';
  st.className = '';
}

const sel = document.getElementById('scene');
for (const [k, v] of Object.entries(SCENES)) {
  sel.insertAdjacentHTML('beforeend', `<option value="${k}">${v.name}</option>`);
}
sel.addEventListener('change', e => setScene(SCENES[e.target.value].build));

document.getElementById('file').addEventListener('change', e => {
  if (e.target.files[0]) loadFile(e.target.files[0]);
});
document.getElementById('save').addEventListener('click', saveFile);
document.getElementById('menu').addEventListener('click', () => {
  if (dialog) return;                    // modal 對話框開著的時候按不動
  menu = menu ? null : { open: null };   // Palm 的 Menu 鍵：叫出來 / 收回去
  about = false;
  render();
});
document.getElementById('reset').addEventListener('click', () => {
  setScene(SCENES[document.getElementById('scene').value].build);
});

// 拖放：file:// 底下沒辦法 fetch 本機檔案，所以拖放和檔案挑選是唯二的入口
const lcd = document.querySelector('.lcd');
for (const ev of ['dragenter', 'dragover']) {
  lcd.addEventListener(ev, e => { e.preventDefault(); lcd.classList.add('drop'); });
}
for (const ev of ['dragleave', 'drop']) {
  lcd.addEventListener(ev, e => { e.preventDefault(); lcd.classList.remove('drop'); });
}
lcd.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});

let autoZoom = true;

function setZoom(z) {
  cv.style.width = cv.width * z + 'px';
  cv.style.height = cv.height * z + 'px';
  cv.parentElement.style.width = cv.width * z + 'px';
  document.getElementById('zoomv').textContent =
    (Math.round(z * 10) / 10) + '×' + (autoZoom ? '（自動）' : '');
}

/* 依可用寬度自動決定倍率。整數倍的像素最乾淨，所以夠接近整數時就吸附過去，
   否則就照比例填滿 —— 手機上填滿寬度比像素工整更重要。 */
/* 依可用寬度自動決定倍率。

   注意不能量 .stage 自己的寬度：它是 shrink-to-fit，寬度由裡面的畫布決定，
   而畫布寬度又是這個函式算出來的 —— 會循環相依，量到的永遠是上一次的結果。
   所以改成量外層 .wrap，同一列時再扣掉右邊那欄。 */
const SIDE_MIN = 260;    // 跟 CSS 的 .side{min-width:260px} 同一個數字

function fitZoom() {
  if (!autoZoom) return;
  const stage = cv.closest('.stage');
  const wrap = document.querySelector('.wrap');
  const pad = parseFloat(getComputedStyle(stage).paddingLeft) || 0;
  const gap = parseFloat(getComputedStyle(wrap).columnGap) || 0;
  /* 側欄是 flex:1，量它的實際寬度又會繞回來，所以用它的最小寬度（常數）
     推算會不會並排 —— 這樣整條計算鏈都不依賴任何被算出來的尺寸。 */
  const twoCol = wrap.clientWidth >= cv.width + SIDE_MIN + gap + pad * 2;
  const avail = wrap.clientWidth - (twoCol ? SIDE_MIN + gap : 0) - pad * 2 - 2;
  if (avail < cv.width) return;        // 版面還沒成形，等 ResizeObserver 再叫一次

  let z = Math.min(6, avail / cv.width);
  // 2 倍以上取整數，像素才會工整；手機上不足 2 倍時允許小數，優先填滿寬度
  z = z >= 2 ? Math.floor(z) : Math.max(1, z);
  document.getElementById('zoom').value = Math.round(z);
  setZoom(z);
}

/* 用 ResizeObserver 而不是只聽 resize：載入當下版面可能還沒成形，
   量到的寬度會是 0，倍率就會塌成 1×。 */
new ResizeObserver(fitZoom).observe(document.querySelector('.wrap'));
document.getElementById('zoom').addEventListener('input', e => { autoZoom = false; setZoom(+e.target.value); });
document.getElementById('zoomauto').addEventListener('click', () => { autoZoom = true; fitZoom(); });
for (const k of ['showId', 'showNodes', 'showGrid', 'showValues', 'showNotReady']) {
  document.getElementById(k).addEventListener('change', e => { opts[k] = e.target.checked; render(); });
}
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', () => render());

/* ========================= 設定值記住（原版沒有） =========================

   右邊那三欄（執行、場景、顯示）本來就不是原版的東西，是網頁版的除錯介面，
   所以它們的狀態怎麼存也沒有 C 那邊的對應。存在 localStorage，key 是
   `mbcwjfx:prefs`，跟存檔區（`mbcwjfx:file:*`）分開。

   兩個不照抄畫面狀態的地方：
   - RUNFOREVER 只還原勾選狀態，**不會自動開跑**。foreverButton（block.c:1991）
     是一勾就開始跑的，但一打開網頁就自己動起來太突然了。
   - 場景只還原內建的那三個（SCENES 的 key）。從 .pdb 載進來的圖不在這裡存，
     那是存檔區的事。 */
const PREFS_KEY = 'mbcwjfx:prefs';
const PREF_CHECKS = ['lamp', 'forever', 'asComponent',
                     'showId', 'showNodes', 'showValues', 'showNotReady', 'showGrid'];

function readPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; }
  catch (e) { return {}; }        // 隱私模式或壞掉的內容：當作沒設定過
}

function savePrefs() {
  const p = { speed: +document.getElementById('speed').value,
              scene: document.getElementById('scene').value,
              autoZoom, zoom: +document.getElementById('zoom').value };
  for (const k of PREF_CHECKS) p[k] = document.getElementById(k).checked;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(p)); } catch (e) { /* 存不進去就算了 */ }
}

function applyPrefs() {
  const p = readPrefs();
  for (const k of PREF_CHECKS) {
    if (typeof p[k] !== 'boolean') continue;
    document.getElementById(k).checked = p[k];
    if (k in opts) opts[k] = p[k];
  }
  LAMP = !!p.lamp;
  RUNFOREVER = !!p.forever;          // 只還原勾選，不觸發 foreverButton 的自動開跑
  if (p.speed >= 1 && p.speed <= 240) {
    document.getElementById('speed').value = p.speed;
    document.getElementById('speedv').textContent = p.speed + '/s';
  }
  if (p.scene in SCENES) document.getElementById('scene').value = p.scene;
  if (p.autoZoom === false && p.zoom >= 1 && p.zoom <= 6) {
    autoZoom = false;
    document.getElementById('zoom').value = p.zoom;
    setZoom(p.zoom);
  }
}

// 三欄裡任何一個控制項動了就存一次（檔案挑選和按鈕不算設定值）
for (const ev of ['change', 'input']) {
  document.querySelector('.side').addEventListener(ev, e => {
    if (e.target.id === 'file') return;
    savePrefs();
  });
}
document.getElementById('zoomauto').addEventListener('click', savePrefs);

/* ========================= 啟動 ========================= */
renderLibrary();

(async function boot() {
  await Promise.all(Object.values(SPRITES).map(s => new Promise(res => {
    s.img = new Image();
    s.img.onload = s.img.onerror = res;
    s.img.src = s.src;
  })));
  document.getElementById('scene').value = 'run';
  applyPrefs();
  scene = (SCENES[document.getElementById('scene').value] || SCENES.run).build();
  resetRun();
  fitZoom();
  syncUI();
})();
</script>
</body>
</html>
