<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MbcWJFX — Block Diagram Viewer</title>
<style>
  :root{
    --bg:#faf9f7; --fg:#1a1a1a; --mut:#6b6b6b; --card:#fff; --bd:#e2e0dc;
    --accent:#3a6ea5; --palm:#c7d0b8;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme=light]){
      --bg:#16171a; --fg:#e8e6e3; --mut:#9a9894; --card:#1f2125; --bd:#31343a;
      --accent:#7aa7d9; --palm:#b9c3a8;
    }
  }
  :root[data-theme=dark]{
    --bg:#16171a; --fg:#e8e6e3; --mut:#9a9894; --card:#1f2125; --bd:#31343a;
    --accent:#7aa7d9; --palm:#b9c3a8;
  }
  *{box-sizing:border-box}
  /* 畫布區塊排在最前面，說明文字挪到後面 —— 一打開就看到那台機器 */
  body{background:var(--bg);color:var(--fg);margin:0;padding:20px 22px 28px;
       display:flex;flex-direction:column;
       font:14px/1.55 ui-sans-serif,system-ui,"Segoe UI","Noto Sans TC",sans-serif}
  .wrap{order:1}
  header{order:2;max-width:1000px;margin:22px auto 0}
  h1{font-size:19px;margin:0 0 3px;letter-spacing:.01em}
  header p{margin:0;color:var(--mut);font-size:13px}
  .wrap{max-width:1000px;margin:0 auto;width:100%;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
  .stage{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
  /* Palm 的 bitmap 是不透明的白底黑點，所以畫布一定要是白的，否則每張圖
     都會拖一塊白方框。LCD 的綠色調用 multiply 疊在上層，白變綠、黑仍是黑。 */
  .lcd{position:relative;display:inline-block;line-height:0;
       border:1px solid var(--bd);border-radius:3px;overflow:hidden}
  .lcd::after{content:"";position:absolute;inset:0;background:var(--palm);
              mix-blend-mode:multiply;pointer-events:none}
  #screen{display:block;background:#fff;image-rendering:pixelated;touch-action:none}
  .side{flex:1;min-width:260px;display:flex;flex-direction:column;gap:14px}
  .panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
  .panel h2{font-size:12px;margin:0 0 10px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
  label.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:13px;cursor:pointer}
  label.row input{accent-color:var(--accent);cursor:pointer}
  .ctl{display:flex;align-items:center;gap:9px;font-size:13px;padding:3px 0}
  .ctl input[type=range]{flex:1;accent-color:var(--accent)}
  #tree{font:12px/1.6 ui-monospace,"Cascadia Code",Consolas,monospace;margin:0;white-space:pre;
        overflow-x:auto}
  #tree .sel{background:var(--accent);color:#fff;border-radius:3px}
  #lib{display:flex;flex-wrap:wrap;gap:6px}
  #lib button{font-size:12px;padding:5px 10px}
  .hint{color:var(--mut);font-size:12px;margin:10px 0 0}
  .filebtn{display:inline-block;border:1px solid var(--bd);border-radius:8px;padding:7px 13px;
           cursor:pointer;font-size:13px;background:var(--bg)}
  .filebtn:hover{border-color:var(--accent);color:var(--accent)}
  .filebtn input{display:none}
  button{border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;
         font:13px inherit;background:var(--bg);color:var(--fg)}
  button:hover{border-color:var(--accent);color:var(--accent)}
  #status,#runstat{font-size:12px;margin:10px 0 0;min-height:1em}
  #runstat{font-variant-numeric:tabular-nums;color:var(--mut)}
  select{border:1px solid var(--bd);border-radius:8px;padding:6px 10px;font:13px inherit;
         background:var(--bg);color:var(--fg);flex:1}
  #status.ok{color:var(--accent)} #status.err{color:#c0392b}
  .lcd.drop{outline:2px dashed var(--accent);outline-offset:3px}
  .tabs{display:flex;gap:5px;margin-bottom:10px}
  .tab{border-radius:8px 8px 0 0;padding:5px 16px;font-size:12.5px}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  code{font:12px ui-monospace,Consolas,monospace;background:var(--bd);padding:1px 5px;border-radius:4px}
  /* 手機：讓 160x160 的畫面撐滿寬度，最接近當年握著 PDA 的比例 */
  @media (max-width:640px){
    body{padding:10px 10px 16px}
    h1{font-size:17px}
    header{margin-top:16px}
    .wrap{gap:14px}
    .stage{padding:10px;width:100%;display:flex;justify-content:center}
    .side{min-width:0;width:100%}
    .panel{padding:12px 13px}
  }
</style>
</head>
<body>

<header>
  <h1>MbcWJFX — Block Diagram Viewer</h1>
  <p>Palm OS 視覺化程式語言的唯讀檢視器。資料模型照 <code>Src/vpl.h</code>，
     繪圖照 <code>Src/block.c</code> 的 <code>DrawDiagram()</code> / <code>DrawWires()</code>。</p>
</header>

<div class="wrap">
  <div class="stage">
    <div class="lcd"><canvas id="screen" width="160" height="160"></canvas></div>
  </div>

  <div class="side">
    <div class="panel">
      <h2>執行</h2>
      <div class="ctl">
        <button id="run" type="button">執行</button>
        <button id="step" type="button">單步</button>
        <button id="stop" type="button">停止</button>
      </div>
      <div class="ctl"><span>速度</span><input type="range" id="speed" min="1" max="240" step="1" value="8"><span id="speedv">8/s</span></div>
      <label class="row"><input type="checkbox" id="lamp">線段動畫（LAMP）</label>
      <label class="row"><input type="checkbox" id="forever">跑完自動重來（RUNFOREVER）</label>
      <p id="runstat"></p>
    </div>

    <div class="panel">
      <h2>場景</h2>
      <div class="ctl">
        <select id="scene"></select>
      </div>
      <label class="filebtn">
        <input type="file" id="file" accept=".pdb,application/octet-stream">
        選擇 .pdb 檔…
      </label>
      <p class="hint">也可以把檔案直接拖到左邊畫面上。範例檔在 <code>web/samples/demo.pdb</code>。</p>
      <p id="status"></p>
      <label class="row"><input type="checkbox" id="asComponent">把 .pdb 當成元件加入（不取代目前的圖）</label>
      <p><button id="save" type="button">存成 .pdb</button>
         <button id="reset" type="button">回到內建測試場景</button>
         <button id="menu" type="button" title="Palm 是按硬體的 Menu 鍵">選單（Menu）</button></p>
    </div>

    <div class="panel">
      <h2>顯示</h2>
      <div class="ctl"><span>縮放</span><input type="range" id="zoom" min="1" max="6" step="1" value="3"><span id="zoomv">3×</span><button id="zoomauto" type="button" title="自動配合視窗寬度">自動</button></div>
      <label class="row"><input type="checkbox" id="showId">顯示元件 ID（SHOW_ID）</label>
      <label class="row"><input type="checkbox" id="showNodes">標出 IO 節點中心</label>
      <label class="row"><input type="checkbox" id="showValues">在圖上疊節點數值</label>
      <label class="row"><input type="checkbox" id="showNotReady">顯示 NotReady 旗標</label>
      <label class="row"><input type="checkbox" id="showGrid">格線</label>
    </div>

    <div class="panel">
      <h2>自訂元件</h2>
      <div id="lib"></div>
      <p class="hint">一張存好的圖可以當成一顆元件用。存檔時最外層會長出接腳，
         接到圖裡的控制鈕（輸入）和顯示器（輸出）。</p>
    </div>

    <div class="panel">
      <h2>場景結構</h2>
      <pre id="tree"></pre>
      <p class="hint">點畫面上的元件可選取（等同 C 裡的 <code>DrawBorder</code>）。</p>
    </div>
  </div>
</div>

<script>
/* ==========================================================================
   資料模型 — 對應 Src/vpl.h
   C 版本每個結構都是手動維護 PREV/NEXT 的雙向鏈結串列（Src/linklist.c 有
   836 行在做這件事）。JS 直接用陣列和物件參照，那些程式碼就不需要了，
   但欄位名稱刻意沿用 C 的寫法，方便跟原始碼對照。
   ========================================================================== */

// BlockType，見 vpl.h
const HOOKBLOCK = 1, FUNCBLOCK = 2, LOOPBLOCK = 3, CASEBLOCK = 4, CTRLBLOCK = 5;

let nextId = 1;

// struct IONODE：TYPE 1 = input、0 = output、2 = drag point
function ioNode(TYPE, TL, EXT, ID = 0) {
  return { ID, TYPE, NotReady: false, BYTES: 2, value: 0, TL, EXT };
}

// struct BlockNode + BA（方塊外觀）。hooks 是內部元件的容器，
// 對應 C 的 LoopBlockHOOKP / CaseBlockHOOKLLHeadP / hookP。
function block(TYPE, BITMAPID, XY, SIZE, opt = {}) {
  return {
    ID: nextId++, TYPE,
    bap: {
      BITMAPID, XY, SIZE,
      IONodeLLHead: opt.io || [],
      CTRLNodeLLHead: opt.ctrl || [],
      DrawBorder: false,
    },
    // 前面板外觀（PA）。同一個元件在方塊圖和前面板上有兩種樣子：
    // bap 是「程式」那一面，pap 是「使用者介面」那一面。
    pap: opt.pap || null,
    hooks: opt.hooks || null,     // [{name, blocks, wires}]
    CurrentHOOK: 0,               // switch case 目前顯示第幾頁
    filename: opt.filename || null,
    parent: null,
  };
}

/* 面板上的控制鈕：右邊 4px 的直條切成上下兩半當加減鈕。
   幾何取自 Src/functions.c:641。 */
function panelCtrl(XY) {
  return {
    BITMAPID: B.CTRLU8Bitmap, XY, SIZE: { x: 32, y: 16 },
    CTRLNodeLLHead: [
      { ID: 4 /*CONTROLUP*/,   TL: { x: 28, y: 0 }, EXT: { x: 4, y: 8 } },
      { ID: 5 /*CONTROLDOWN*/, TL: { x: 28, y: 8 }, EXT: { x: 4, y: 8 } },
    ],
  };
}
function panelIndicator(XY) {
  return { BITMAPID: B.INDICATOR8Bitmap, XY, SIZE: { x: 32, y: 16 }, CTRLNodeLLHead: [] };
}

// struct wList。C 裡存的是節點指標，這裡存物件參照，語意相同。
function wire(sb, sn, eb, en) {
  return { WireID: nextId++, StartBlockP: sb, StartNodeP: sn, EndBlockP: eb, EndNodeP: en, DIRTY: false };
}

/* 補上 parent，讓 DrawWires 能像 C 那樣沿 SelfBlockLLHead 往上走，
   把巢狀元件的相對座標累加成絕對座標（block.c:166-189）。 */
function linkParents(blocks, parent = null) {
  for (const b of blocks) {
    b.parent = parent;
    for (const h of b.hooks || []) linkParents(h.blocks, b);
  }
}

/* ==========================================================================
   測試場景 — 對應 Src/testdata.c 的 set_test_data()
   （那個函式在原始碼裡整段被註解掉，這裡把它重建起來當第一個渲染目標，
     所以還不需要先解 .pdb 存檔格式。）
   ========================================================================== */
function buildScene() {
  nextId = 1;

  // 一個輸出元件（CTRLU8：8-bit 控制鈕）
  const ctrl = block(FUNCBLOCK, B.CTRLU8BLOCKBitmap, { x: 6, y: 16 }, { x: 32, y: 16 },
    { io: [ioNode(0, { x: 0, y: 0 }, { x: 32, y: 16 })], pap: panelCtrl({ x: 12, y: 30 }) });

  // 一個輸入元件（INDICATOR8：8-bit 顯示器）
  const ind = block(FUNCBLOCK, B.INDICATOR8BLOCKBitmap, { x: 108, y: 16 }, { x: 32, y: 16 },
    { io: [ioNode(1, { x: 0, y: 0 }, { x: 32, y: 16 })], pap: panelIndicator({ x: 100, y: 30 }) });

  // FORLOOP：結構元件，內部自己有一份 blocks/wires（C 的 LoopBlockHOOKP）。
  // 迴圈內預設元件 N 和 I 的位置由 block.c:760-766 寫死。
  const loopSize = { x: 74, y: 62 };
  const forN = block(FUNCBLOCK, B.FORLOOPNBitmap, { x: 8, y: 13 }, { x: 10, y: 10 },
    { io: [ioNode(1, { x: 0, y: 0 }, { x: 10, y: 10 })] });
  const forI = block(FUNCBLOCK, B.FORLOOPIBitmap, { x: 8, y: loopSize.y - 17 }, { x: 10, y: 10 },
    { io: [ioNode(0, { x: 0, y: 0 }, { x: 10, y: 10 })] });
  const arith = block(FUNCBLOCK, B.FUNCARITHBitmap, { x: 30, y: 15 }, { x: 32, y: 32 },
    { io: [ioNode(1, { x: 0, y: 0 }, { x: 32, y: 32 })] });
  const forloop = block(LOOPBLOCK, B.FORLOOPBitmap, { x: 12, y: 52 }, loopSize, {
    ctrl: [{ ID: 1 /*DRAGNODE*/, TL: { x: loopSize.x - 7, y: loopSize.y - 7 }, EXT: { x: 7, y: 7 } }],
    hooks: [{
      name: null,
      blocks: [forN, forI, arith],
      wires: [wire(forI, forI.bap.IONodeLLHead[0], arith, arith.bap.IONodeLLHead[0])],
    }],
    io: [ioNode(1, { x: 0, y: 24 }, { x: 6, y: 6 })],
  });

  // SWITCHCASE：兩頁 hook，名字 "true" / "false"（testdata.c 原本就是這兩個字串）
  const swSize = { x: 46, y: 40 };
  const lamp = block(FUNCBLOCK, B.LAMPBitmap, { x: 15, y: 18 }, { x: 16, y: 16 },
    { io: [ioNode(1, { x: 0, y: 0 }, { x: 16, y: 16 })] });
  const led = block(FUNCBLOCK, B.LEDOFFBitmap, { x: 15, y: 18 }, { x: 16, y: 16 },
    { io: [ioNode(1, { x: 0, y: 0 }, { x: 16, y: 16 })] });
  const swcase = block(CASEBLOCK, B.SWITCHCASEBitmap, { x: 100, y: 60 }, swSize, {
    ctrl: [
      { ID: 1 /*DRAGNODE*/,   TL: { x: swSize.x - 7, y: swSize.y - 7 }, EXT: { x: 7, y: 7 } },
      { ID: 2 /*SCPAGEUP*/,   TL: { x: swSize.x - 7, y: 1 },            EXT: { x: 6, y: 13 } },
      { ID: 3 /*SCPAGEDOWN*/, TL: { x: 1, y: 1 },                       EXT: { x: 6, y: 13 } },
    ],
    hooks: [
      { name: 'true',  blocks: [lamp], wires: [] },
      { name: 'false', blocks: [led],  wires: [] },
    ],
    io: [ioNode(1, { x: 0, y: 20 }, { x: 6, y: 6 })],
  });

  const blocks = [ctrl, ind, forloop, swcase];
  const wires = [
    wire(ctrl, ctrl.bap.IONodeLLHead[0], ind, ind.bap.IONodeLLHead[0]),
    wire(ctrl, ctrl.bap.IONodeLLHead[0], forloop, forloop.bap.IONodeLLHead[0]),
    wire(forloop, forloop.bap.IONodeLLHead[0], swcase, swcase.bap.IONodeLLHead[0]),
  ];
  linkParents(blocks);
  return { blocks, wires };
}

/* 第二個場景：這張是拿來「跑」的。上半是 5 + 3 送進顯示器，
   下半是一個數到 3 的 for 迴圈，把計數器 I 接到迴圈內的顯示器。 */
/* 第二個場景：這張是拿來「跑」的。
   上半是 5 + 3 送進顯示器；下半是一個 for 迴圈，計數上限 N 從**迴圈外面**
   餵進去、計數值 I 再送到迴圈外面的顯示器 —— 兩條線都跨越了結構邊界，
   由 crossWire() 在迴圈邊框上長出接點（block.c:1206）。 */
function buildRunScene() {
  nextId = 1;

  const ctrlA = block(FUNCBLOCK, B.CTRLU8BLOCKBitmap, { x: 2, y: 20 }, { x: 32, y: 16 },
    { io: [ioNode(0, { x: 0, y: 0 }, { x: 32, y: 16 })], pap: panelCtrl({ x: 12, y: 24 }) });
  const ctrlB = block(FUNCBLOCK, B.CTRLU8BLOCKBitmap, { x: 2, y: 42 }, { x: 32, y: 16 },
    { io: [ioNode(0, { x: 0, y: 0 }, { x: 32, y: 16 })], pap: panelCtrl({ x: 12, y: 48 }) });
  ctrlA.bap.IONodeLLHead[0].value = 5;
  ctrlB.bap.IONodeLLHead[0].value = 3;

  // 運算元件的節點順序就是 run.c 取值的順序：[0]、[1] 是輸入，[2] 是輸出
  const add = block(FUNCBLOCK, B.ADDBitmap, { x: 58, y: 31 }, { x: 16, y: 16 }, {
    io: [
      ioNode(1, { x: 0, y: 0 }, { x: 8, y: 8 }),
      ioNode(1, { x: 0, y: 8 }, { x: 8, y: 8 }, 1),
      ioNode(0, { x: 8, y: 0 }, { x: 8, y: 16 }, 2),
    ],
  });
  const ind = block(FUNCBLOCK, B.INDICATOR8BLOCKBitmap, { x: 100, y: 31 }, { x: 32, y: 16 },
    { io: [ioNode(1, { x: 0, y: 0 }, { x: 32, y: 16 })], pap: panelIndicator({ x: 100, y: 36 }) });

  // 迴圈內部只有預設的 N 和 I。原版 run.c:1293 是直接拿 blocks[0] 當 N、
  // blocks[1] 當 I，這裡改成用 BITMAPID 認（見 doRunLoopBlock）。
  const loopSize = { x: 72, y: 60 };
  const N = block(FUNCBLOCK, B.FORLOOPNBitmap, { x: 8, y: 13 }, { x: 10, y: 10 },
    { io: [ioNode(1, { x: 0, y: 0 }, { x: 10, y: 10 })] });
  const I = block(FUNCBLOCK, B.FORLOOPIBitmap, { x: 8, y: loopSize.y - 17 }, { x: 10, y: 10 },
    { io: [ioNode(0, { x: 0, y: 0 }, { x: 10, y: 10 })] });

  const forloop = block(LOOPBLOCK, B.FORLOOPBitmap, { x: 44, y: 66 }, loopSize, {
    ctrl: [{ ID: 1, TL: { x: loopSize.x - 7, y: loopSize.y - 7 }, EXT: { x: 7, y: 7 } }],
    hooks: [{ name: null, blocks: [N, I], wires: [] }],
  });

  // 迴圈外面：餵 N 的控制鈕，和讀 I 的顯示器
  const count = block(FUNCBLOCK, B.CTRLU8BLOCKBitmap, { x: 2, y: 76 }, { x: 32, y: 16 },
    { io: [ioNode(0, { x: 0, y: 0 }, { x: 32, y: 16 })], pap: panelCtrl({ x: 12, y: 96 }) });
  count.bap.IONodeLLHead[0].value = 3;
  const readout = block(FUNCBLOCK, B.INDICATOR8BLOCKBitmap, { x: 124, y: 76 }, { x: 32, y: 16 },
    { io: [ioNode(1, { x: 0, y: 0 }, { x: 32, y: 16 })], pap: panelIndicator({ x: 100, y: 96 }) });

  const s = {
    blocks: [ctrlA, ctrlB, add, ind, forloop, count, readout],
    wires: [
      wire(ctrlA, ctrlA.bap.IONodeLLHead[0], add, add.bap.IONodeLLHead[0]),
      wire(ctrlB, ctrlB.bap.IONodeLLHead[0], add, add.bap.IONodeLLHead[1]),
      wire(add, add.bap.IONodeLLHead[2], ind, ind.bap.IONodeLLHead[0]),
    ],
  };
  linkParents(s.blocks);

  /* 這兩條要跨越迴圈邊界，交給 crossWire 去長邊框節點。它是對「目前場景」
     動作的，所以先把 scene 指過來。 */
  const prev = scene;
  scene = s;
  addWire({ block: count, node: count.bap.IONodeLLHead[0] }, { block: N, node: N.bap.IONodeLLHead[0] });
  addWire({ block: I, node: I.bap.IONodeLLHead[0] }, { block: readout, node: readout.bap.IONodeLLHead[0] });
  scene = prev;

  return s;
}

function buildEmptyScene() {
  nextId = 1;
  return { blocks: [], wires: [] };
}

const SCENES = {
  layout: { name: '版面示範', build: buildScene },
  run: { name: '資料流（可執行）', build: buildRunScene },
  empty: { name: '空白（自己畫）', build: buildEmptyScene },
};

/* ==========================================================================
   繪圖 — 對應 Src/block.c
   Palm 的 WinDrawLine 是 1 像素、無反鋸齒的黑線。canvas 要畫出一樣的
   效果就得把座標對到像素中心（+0.5），否則線會糊成兩像素的灰。
   ========================================================================== */
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
const opts = { showId: false, showNodes: false, showGrid: false, showValues: false, showNotReady: false };
let scene = null, selected = null, view = 'block';

// Palm 的 WinEraseRectangle 是清成白色；LCD 色調由 CSS 的 .lcd::after 疊上去
const PAPER = '#ffffff';
function line(x1, y1, x2, y2) {           // WinDrawLine
  ctx.beginPath();
  ctx.moveTo(x1 + .5, y1 + .5);
  ctx.lineTo(x2 + .5, y2 + .5);
  ctx.stroke();
}
function rect(x, y, w, h) {               // WinDrawRectangle(&r, 0)
  ctx.strokeRect(x + .5, y + .5, w - 1, h - 1);
}
function eraseRect(x, y, w, h) {          // WinEraseRectangle
  const keep = ctx.fillStyle;
  ctx.fillStyle = PAPER;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = keep;
}
function icon(id, x, y) {                 // misc.c:84 DrawIcon
  const s = SPRITES[id];
  if (s && s.img && s.img.complete) ctx.drawImage(s.img, x, y);
}

// block.c:95 CaculateTurnLine — 起點水平走到中間 x，轉垂直，再水平接到終點
function turnLine(start, end) {
  if (start.x === end.x || start.y === end.y) return [{ ...start }, { ...start }];
  const mx = Math.floor((start.x + end.x) / 2);
  return [{ x: mx, y: start.y }, { x: mx, y: end.y }];
}

// block.c:166-189 — 巢狀元件要沿所屬串列往上累加，才得到絕對座標
function absOrigin(b) {
  let x = 0, y = 0;
  for (let p = b.parent; p; p = p.parent) { x += p.bap.XY.x; y += p.bap.XY.y; }
  return { x, y };
}
function nodeCenter(b, n) {
  const o = absOrigin(b);
  return {
    x: o.x + b.bap.XY.x + n.TL.x + Math.floor(n.EXT.x / 2),
    y: o.y + b.bap.XY.y + n.TL.y + Math.floor(n.EXT.y / 2),
  };
}

// block.c:111 DrawWires
function drawWires(wires) {
  for (const w of wires) {
    const s = nodeCenter(w.StartBlockP, w.StartNodeP);
    const e = nodeCenter(w.EndBlockP, w.EndNodeP);
    const [t1, t2] = turnLine(s, e);
    line(s.x, s.y, t1.x, t1.y);
    line(t1.x, t1.y, t2.x, t2.y);
    line(t2.x, t2.y, e.x, e.y);
  }
}

// block.c:687 DrawDiagram — 先畫線段，再依 TYPE 畫元件，結構元件遞迴進去
function drawDiagram(blocks, wires, wx, wy) {
  drawWires(wires);

  for (const b of blocks) {
    const { XY, SIZE } = b.bap;
    const x = XY.x + wx, y = XY.y + wy;

    switch (b.TYPE) {
      case LOOPBLOCK: {                                   // block.c:721
        eraseRect(x, y, SIZE.x, SIZE.y);
        icon(B.LOOP2Bitmap, x, y);
        icon(B.LOOP3Bitmap, x + SIZE.x - 5, y);
        icon(B.LOOP4Bitmap, x + SIZE.x - 5, y + SIZE.y - 5);
        icon(B.LOOP5Bitmap, x, y + SIZE.y - 5);
        const x1 = x + 7, x2 = x + SIZE.x - 6;            // 上下兩組雙橫線
        line(x1, y, x2, y);
        line(x1, y + 2, x2, y + 2);
        line(x1, y + SIZE.y - 1, x2, y + SIZE.y - 1);
        line(x1, y + SIZE.y - 3, x2, y + SIZE.y - 3);
        const y1 = y + 5, y2 = y + SIZE.y - 6;            // 左右兩組雙直線
        line(x + 2, y1, x + 2, y2);
        line(x + 4, y1, x + 4, y2);
        line(x + SIZE.x - 3, y1, x + SIZE.x - 3, y2);
        line(x + SIZE.x - 1, y1, x + SIZE.x - 1, y2);
        icon(B.LOOP1Bitmap, x, y + Math.floor(SIZE.y / 2) - 3);
        for (const n of b.bap.IONodeLLHead) rect(x + n.TL.x, y + n.TL.y, n.EXT.x, n.EXT.y);
        const h = b.hooks[0];
        drawDiagram(h.blocks, h.wires, x, y);             // 遞迴內部元件
        break;
      }
      case CASEBLOCK: {                                   // block.c:839
        eraseRect(x, y, SIZE.x, SIZE.y);
        icon(B.SC1Bitmap, x + SIZE.x - 6, y + 4);
        icon(B.SC2Bitmap, x + 2, y + 4);
        line(x, y + 13, x + SIZE.x - 1, y + 13);
        line(x, y, x + SIZE.x - 1, y);                    // 雙線外框
        line(x, y + 1, x + SIZE.x - 1, y + 1);
        line(x, y + SIZE.y - 2, x + SIZE.x - 1, y + SIZE.y - 2);
        line(x, y + SIZE.y - 1, x + SIZE.x - 1, y + SIZE.y - 1);
        line(x, y, x, y + SIZE.y - 1);
        line(x + 1, y, x + 1, y + SIZE.y - 1);
        line(x + SIZE.x - 1, y, x + SIZE.x - 1, y + SIZE.y - 1);
        line(x + SIZE.x - 2, y, x + SIZE.x - 2, y + SIZE.y - 1);
        const h = b.hooks[b.CurrentHOOK];
        ctx.font = '9px ui-monospace,Consolas,monospace';
        ctx.textBaseline = 'top';
        ctx.fillText(h.name, x + Math.floor(SIZE.x / 2) - Math.floor(h.name.length * 5 / 2), y + 2);
        for (const n of b.bap.IONodeLLHead) rect(x + n.TL.x, y + n.TL.y, n.EXT.x, n.EXT.y);
        drawDiagram(h.blocks, h.wires, x, y);
        break;
      }
      case HOOKBLOCK: {                                   // block.c:714
        // block.c:301 DrawCUSTOMBLOCKLattice：一個矩形從中間切兩半，
        // 左半按輸入數畫橫線、右半按輸出數畫橫線，就是接腳的格子。
        eraseRect(x, y, SIZE.x, SIZE.y);
        rect(x, y, SIZE.x, SIZE.y);
        const mid = x + Math.floor(SIZE.x / 2);
        line(mid, y, mid, y + SIZE.y - 1);
        const ins = b.bap.IONodeLLHead.filter(n => n.TYPE === 1).length;
        const outs = b.bap.IONodeLLHead.filter(n => n.TYPE === 0).length;
        for (let i = 1; i <= ins - 1; i++) {
          const hy = Math.floor(SIZE.y / ins) * i + y;
          line(x, hy, mid, hy);
        }
        for (let i = 1; i <= outs - 1; i++) {
          const hy = Math.floor(SIZE.y / outs) * i + y;
          line(mid, hy, x + SIZE.x - 1, hy);
        }
        if (b.filename) {                                 // block.c:717 檔名畫在下面
          ctx.font = '9px ui-monospace,Consolas,monospace';
          ctx.textBaseline = 'top';
          ctx.fillText(b.filename, x, y + SIZE.y + 1);
        }
        // 內部不畫 —— 原版的 HOOKBLOCK case 也沒有遞迴進去
        break;
      }
      default:                                            // block.c:949，FUNCBLOCK 等
        icon(b.bap.BITMAPID, x, y);
    }

    if (b.bap.DrawBorder) {                               // block.c:966 選取外框
      rect(x - 1, y - 1, SIZE.x + 3, SIZE.y + 3);
    }
    if (b.bap.NoInput) {          // 輸入沒接線 —— 網頁版加的錯誤標記，原版沒有
      rect(x - 3, y - 3, SIZE.x + 7, SIZE.y + 7);
      ctx.font = 'bold 9px ui-monospace,Consolas,monospace';
      ctx.textBaseline = 'top';
      /* 外框佔到 x-3 ～ x+SIZE.x+3，驚嘆號要再留 3 像素空隙才不會黏在框上。
         優先擺右邊，右邊不夠就左邊，左右都不夠就擺框的上面（再不行擺下面）。 */
      const gap = 3, cw = 5, ch = 9, fr = x + SIZE.x + 3, fb = y + SIZE.y + 3;
      let ex, ey = y - 3;
      if (fr + gap + cw <= 159) ex = fr + gap;
      else if (x - 3 - gap - cw >= 0) ex = x - 3 - gap - cw;
      else {
        ex = x;
        ey = (y - 3 - gap - ch >= 0) ? y - 3 - gap - ch : fb + gap;
      }
      ctx.fillText('!', ex, ey);
    }
    if (opts.showId) {                                    // block.c:1009 SHOW_ID
      ctx.font = '8px ui-monospace,Consolas,monospace';
      ctx.textBaseline = 'top';
      ctx.fillText(String(b.ID), x, y - 9);
    }
    if (opts.showNodes) {
      for (const n of b.bap.IONodeLLHead) {
        const c = nodeCenter(b, n);
        ctx.fillRect(c.x - 1, c.y - 1, 3, 3);
      }
    }
    // 執行狀態：節點數值，以及 block.c:213 SHOW_NOTREADYBIT 的 T/F 旗標
    if (opts.showValues || opts.showNotReady) {
      ctx.font = '8px ui-monospace,Consolas,monospace';
      ctx.textBaseline = 'top';
      for (const n of b.bap.IONodeLLHead) {
        const c = nodeCenter(b, n);
        let t = '';
        if (opts.showValues) t += n.value | 0;
        if (opts.showNotReady) t += (opts.showValues ? ':' : '') + (n.NotReady ? 'T' : 'F');
        const wpx = ctx.measureText(t).width;
        eraseRect(c.x - wpx / 2 - 1, c.y - 4, wpx + 2, 9);
        ctx.fillText(t, c.x - wpx / 2, c.y - 4);
      }
    }
  }
}

/* ==========================================================================
   元件面板與工具選單 — 對應 Src/functions.c

   兩個彈出視窗的幾何寫在 Src/StarterRsc.h 的表單定義裡：
   FunctionsForm 是 (50,1) 100x157，BlockToolsForm 是 (118,1) 40x109。
   格線排法取自 functions.c:333 DrawToolIcon()：x 依序 1/34/67，
   每滿三個換行、y 加 35，起點 (1,16) —— 這些都是相對於視窗左上角。
   ========================================================================== */

const FORM_FUNCTIONS = { x: 50, y: 1, w: 100, h: 157 };
const FORM_TOOLS = { x: 118, y: 1, w: 40, h: 109 };

// 工具選單的內容（block.c:3044 的 PageUp 循環順序）
const BLOCK_TOOLS = ['HANDBitmap', 'DRAGBitmap', 'THREADBitmap', 'SCISSORBitmap', 'KILLBitmap'];
const PANEL_TOOLS = ['HANDBitmap', 'FINGERBitmap', 'PENCILBitmap'];

let popup = null;        // null | {kind:'functions', cat:number|null} | {kind:'tools'}

// functions.c:333 DrawToolIcon 的格線
function paletteSlot(i) {
  return { x: 1 + (i % 3) * 33, y: 16 + Math.floor(i / 3) * 35 };
}

function drawFormFrame(f, title) {
  eraseRect(f.x, f.y, f.w, f.h);
  rect(f.x, f.y, f.w, f.h);
  ctx.fillRect(f.x, f.y, f.w, 13);
  ctx.font = 'bold 10px ui-sans-serif,system-ui,sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.fillText(title, f.x + f.w / 2 - ctx.measureText(title).width / 2, f.y + 1);
  ctx.fillStyle = '#111';
}

function popupItems() {
  if (!popup) return [];
  if (popup.kind === 'tools') return (view === 'panel' ? PANEL_TOOLS : BLOCK_TOOLS).map(n => ({ bmp: B[n] }));
  return popup.cat === null ? PALETTE : PALETTE[popup.cat].items;
}

function drawPopup() {
  if (!popup) return;
  if (popup.kind === 'tools') {
    const f = FORM_TOOLS;
    drawFormFrame(f, 'Tools');
    popupItems().forEach((it, i) => {
      const x = f.x + 11, y = f.y + 16 + i * 18;
      icon(it.bmp, x, y);
      if (it.bmp === pointerStateGet()) rect(x - 2, y - 2, 22, 22);   // 目前選的工具
    });
    return;
  }
  const f = FORM_FUNCTIONS;
  drawFormFrame(f, popup.cat === null ? 'Functions' : PALETTE[popup.cat].name.replace('FUNC', ''));
  popupItems().forEach((it, i) => {
    const s = paletteSlot(i);
    icon(it.bmp, f.x + s.x, f.y + s.y);
  });
}

/* ==========================================================================
   下拉選單與關於畫面 — block.c:2891 BlockDiagramFormDoCommand / Src/about.c

   選單的內容不在 .c 裡，是 Starter.prc 的 MBAR 1000（方塊圖）和 MBAR 1100
   （前面板）資源。兩個只差在 Works 的最後一項：方塊圖是 Functions、
   前面板是 UIs。字串照抄資源裡的，包含 "-" 那條分隔線。

   Palm 是按硬體的 Menu 鍵叫出選單，網頁沒有那顆鍵，所以在右邊那欄放一個
   按鈕（跟執行控制那些一樣是網頁版自己加的）。選單本身照原版畫在
   160x160 螢幕裡面。
   ========================================================================== */

const MENUS = [
  { title: 'File', items: [
      { text: 'NEW', cmd: 'FileNEW' },
      { text: 'SAVE', cmd: 'FileSAVE' },
      { text: 'LOAD', cmd: 'FileLOAD' },
  ] },
  { title: 'Works', items: [
      { text: 'Block Diagram', cmd: 'WorksBlockDiagram' },
      { text: 'Front Panel', cmd: 'WorksFrontPanel' },
      { text: '-' },
      { text: 'Functions', cmd: 'WorksFunctions', panelText: 'UIs' },
  ] },
  { title: 'Run', items: [
      { text: 'Run', cmd: 'RunRun' },
      { text: 'Stop', cmd: 'RunStop' },
  ] },
  { title: 'About', items: [
      { text: 'About MbcWJFX', cmd: 'AboutMbcWJFX' },
  ] },
];

const MENUBAR_H = 13;          // 標題列高度，跟 drawFormFrame 的一致
const MENUITEM_H = 11;         // MBAR 1000 的 File 下拉是 34x33 ＝ 3 項 × 11

let menu = null;               // null | {open: number|null}
let about = false;             // AboutForm 是 modal，開著的時候什麼都不能點

function menuItems(m) {
  // MBAR 1100 的 Works 最後一項在前面板是 UIs
  return m.items.map(it => ({ ...it, text: view === 'panel' && it.panelText ? it.panelText : it.text }));
}

function menuTitleRects() {
  ctx.font = 'bold 10px ui-sans-serif,system-ui,sans-serif';
  const out = [];
  let x = 2;
  for (const m of MENUS) {
    const w = Math.ceil(ctx.measureText(m.title).width) + 8;
    out.push({ x, y: 0, w, h: MENUBAR_H, menu: m });
    x += w;
  }
  return out;
}

function menuPullRect(i) {
  const t = menuTitleRects()[i];
  const items = menuItems(MENUS[i]);
  ctx.font = '10px ui-sans-serif,system-ui,sans-serif';
  let w = 0;
  for (const it of items) w = Math.max(w, Math.ceil(ctx.measureText(it.text).width));
  w += 10;
  const x = Math.min(t.x, cv.width - w - 1);
  return { x, y: MENUBAR_H, w, h: items.length * MENUITEM_H + 2, items };
}

function drawMenu() {
  if (!menu) return;
  // 標題列：黑底白字，蓋掉畫面最上面那一條
  eraseRect(0, 0, cv.width, MENUBAR_H);
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, cv.width, MENUBAR_H);
  ctx.textBaseline = 'top';
  ctx.font = 'bold 10px ui-sans-serif,system-ui,sans-serif';
  menuTitleRects().forEach((t, i) => {
    ctx.fillStyle = i === menu.open ? '#fff' : '#111';
    ctx.fillRect(t.x, 0, t.w, MENUBAR_H);
    ctx.fillStyle = i === menu.open ? '#111' : '#fff';
    ctx.fillText(t.menu.title, t.x + 4, 2);
  });
  ctx.fillStyle = '#111';
  if (menu.open === null) return;

  const r = menuPullRect(menu.open);
  eraseRect(r.x, r.y, r.w, r.h);
  rect(r.x, r.y, r.w, r.h);
  ctx.font = '10px ui-sans-serif,system-ui,sans-serif';
  r.items.forEach((it, i) => {
    const y = r.y + 1 + i * MENUITEM_H;
    if (it.text === '-') { line(r.x + 2, y + 5, r.x + r.w - 3, y + 5); return; }
    ctx.fillText(it.text, r.x + 4, y + 1);
  });
}

/* Src/about.c AboutFormHandleEvent + StarterRsc.h 的 AboutForm 版面。
   文字取自 Starter.prc 的 tFRM 1200（含原本就打錯的 "enviroment"）。 */
function drawAbout() {
  if (!about) return;
  eraseRect(0, 0, 160, 160);
  rect(0, 0, 160, 160);
  ctx.fillRect(0, 0, 160, 13);
  ctx.textBaseline = 'top';
  ctx.font = 'bold 10px ui-sans-serif,system-ui,sans-serif';
  ctx.fillStyle = '#fff';
  const t = 'About MbcWJFX';
  ctx.fillText(t, 80 - ctx.measureText(t).width / 2, 1);
  ctx.fillStyle = '#111';

  icon(B.ADDBitmap, 38, 30);              // AboutUnnamed1201BitMap，PICT 1000
  ctx.font = 'bold 12px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('MbcWJFX', 62, 30);        // AboutUnnamed1202Label (62,30) Bold 12
  ctx.font = '10px ui-sans-serif,system-ui,sans-serif';
  // AboutUnnamed1203Label (40,65)，資源裡是用 CR 斷行的三行
  ['MbcWJFX is a', 'VPL development', 'enviroment.']
    .forEach((ln, i) => ctx.fillText(ln, 40, 65 + i * 12));
  ctx.font = 'bold 10px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('Version V0.9', 38, 110);  // AboutUnnamed1204Label (38,110) Bold
  icon(B.dahaiBitmap, 71, 121);           // AboutUnnamed1206BitMap，PICT 1900
  // about.c:32 WinDrawChars(str,...,0,150)：原版印 __DATE__ __TIME__
  ctx.font = '9px ui-sans-serif,system-ui,sans-serif';
  ctx.fillText('Last compiled:' + BUILD_STAMP, 0, 150);
}

const BUILD_STAMP = (() => {
  const d = new Date(document.lastModified);
  return isNaN(d) ? ' web' : ' ' + d.toDateString().slice(4) + ' ' + d.toTimeString().slice(0, 8);
})();

// block.c:2891 BlockDiagramFormDoCommand
function doCommand(cmd) {
  menu = null;
  switch (cmd) {
    case 'FileNEW': setScene(buildEmptyScene); view = 'block'; runStatus('NEW —— 空白的圖'); break;
    // block.c:2957 FrmPopupForm(SAVEForm)
    case 'FileSAVE': dialog = { kind: 'save', text: '' }; break;
    // block.c:2963 CUSTOMLOAD=false 之後 FrmPopupForm(LOADForm)
    case 'FileLOAD': dialog = { kind: 'load', names: fileList(), sel: 0, custom: false }; break;
    case 'WorksBlockDiagram': view = 'block'; keyboardObject = null; break;
    case 'WorksFrontPanel': view = 'panel'; keyboardObject = null; break;
    case 'WorksFunctions': popup = { kind: 'functions', cat: null }; break;
    case 'RunRun': runButton(); break;
    case 'RunStop': stopButton(); break;
    case 'AboutMbcWJFX': about = true; break;
  }
  render();
}

/* 傳回 true 代表這一下被選單／關於畫面吃掉了，後面的處理都不要做 */
function menuPenDown(px, py) {
  if (about) { about = false; render(); return true; }   // about.c:38 點一下就回去
  if (!menu) return false;
  const titles = menuTitleRects();
  for (let i = 0; i < titles.length; i++) {
    const t = titles[i];
    if (px >= t.x && px < t.x + t.w && py < MENUBAR_H) {
      menu.open = menu.open === i ? null : i;
      render();
      return true;
    }
  }
  if (menu.open !== null) {
    const r = menuPullRect(menu.open);
    if (px >= r.x && px < r.x + r.w && py >= r.y && py < r.y + r.h) {
      const i = Math.floor((py - r.y - 1) / MENUITEM_H);
      const it = r.items[i];
      if (it && it.cmd) doCommand(it.cmd);
      return true;
    }
  }
  menu = null;                 // 點在選單外面就收起來
  render();
  return true;
}

/* ==========================================================================
   存檔／載入對話框 — save.c:565 SAVEFormHandleEvent、load.c:775 LOADFormHandleEvent

   原版每一個存檔就是一個 Palm database（load.c:820 的註解「每一個 database
   代表一個存檔」），LOADForm 用 DmGetNextDatabaseByTypeCreator 把 creator
   'wjfx' 的資料庫全部列出來。瀏覽器沒有那種東西，改用 localStorage 當那個
   「機器裡的檔案區」，一個 key 一個存檔。

   兩張表單的幾何完全照 Src/StarterRsc.h 的資源註解，按鈕文字取自
   Starter.prc 的 tFRM 1400 / 1600。刪除確認框是 Talt 1000。
   ========================================================================== */

const FILE_PREFIX = 'mbcwjfx:file:';

// 無痕視窗或被擋掉的時候 localStorage 會直接丟例外，全部包起來
function fileList() {
  const out = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(FILE_PREFIX)) out.push(k.slice(FILE_PREFIX.length));
    }
  } catch (e) { /* 沒得存就是沒有檔案 */ }
  return out.sort();
}
const fileRead = n => { try { return localStorage.getItem(FILE_PREFIX + n); } catch (e) { return null; } };
const fileWrite = (n, t) => { try { localStorage.setItem(FILE_PREFIX + n, t); return true; } catch (e) { return false; } };
const fileDelete = n => { try { localStorage.removeItem(FILE_PREFIX + n); } catch (e) {} };

// StarterRsc.h: SAVEForm (1,94) 158x64、LOADForm (1,22) 158x136
const FORM_SAVE = { x: 1, y: 94, w: 158, h: 64 };
const FORM_LOAD = { x: 1, y: 22, w: 158, h: 136 };
// 表單內的相對座標，一樣照資源註解
const SAVE_FIELD = { x: 8, y: 24, w: 144, h: 16 };
const SAVE_BTNS = [
  { id: 'ok', x: 114, y: 47, w: 36, h: 12, text: 'OK' },
  { id: 'cancel', x: 65, y: 47, w: 40, h: 12, text: 'CANCEL' },
];
const LOAD_LIST = { x: 2, y: 14, w: 154, rows: 9, h: 11 };   // Visible Items = 9
const LOAD_BTNS = [
  { id: 'load', x: 119, y: 120, w: 36, h: 12, text: 'LOAD' },
  { id: 'delete', x: 74, y: 120, w: 40, h: 12, text: 'DELETE' },
  { id: 'cancel', x: 29, y: 120, w: 40, h: 12, text: 'CANCEL' },
];
const CONFIRM_FORM = { x: 10, y: 50, w: 140, h: 60 };
const CONFIRM_BTNS = [
  { id: 'ok', x: 96, y: 44, w: 36, h: 12, text: 'OK' },
  { id: 'cancel', x: 48, y: 44, w: 40, h: 12, text: 'CANCEL' },
];

/* null | {kind:'save', text}
        | {kind:'load', names, sel, custom}     custom = functions.c:1007 的 CUSTOMLOAD
        | {kind:'confirm', name, back}          Talt 1000 DeleteFileComfirAlert */
let dialog = null;

function drawButton(f, b) {
  eraseRect(f.x + b.x, f.y + b.y, b.w, b.h);
  rect(f.x + b.x, f.y + b.y, b.w, b.h);
  ctx.font = 'bold 10px ui-sans-serif,system-ui,sans-serif';
  ctx.textBaseline = 'top';
  const w = ctx.measureText(b.text).width;
  ctx.fillText(b.text, f.x + b.x + (b.w - w) / 2, f.y + b.y + 1);
}

function drawDialog() {
  if (!dialog) return;
  if (dialog.kind === 'save') {
    const f = FORM_SAVE;
    drawFormFrame(f, 'Input File Name');
    // Underline = 1 的欄位：只有底下那一條線
    line(f.x + SAVE_FIELD.x, f.y + SAVE_FIELD.y + SAVE_FIELD.h,
         f.x + SAVE_FIELD.x + SAVE_FIELD.w, f.y + SAVE_FIELD.y + SAVE_FIELD.h);
    ctx.font = '10px ui-sans-serif,system-ui,sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText(dialog.text, f.x + SAVE_FIELD.x + 1, f.y + SAVE_FIELD.y + 3);
    const w = ctx.measureText(dialog.text).width;   // 游標
    line(f.x + SAVE_FIELD.x + 2 + w, f.y + SAVE_FIELD.y + 3,
         f.x + SAVE_FIELD.x + 2 + w, f.y + SAVE_FIELD.y + 13);
    SAVE_BTNS.forEach(b => drawButton(f, b));
    return;
  }
  if (dialog.kind === 'load') {
    const f = FORM_LOAD, L = LOAD_LIST;
    drawFormFrame(f, 'Files');
    ctx.font = '10px ui-sans-serif,system-ui,sans-serif';
    ctx.textBaseline = 'top';
    if (!dialog.names.length) ctx.fillText('(no files)', f.x + L.x + 2, f.y + L.y + 1);
    dialog.names.slice(0, L.rows).forEach((n, i) => {
      const y = f.y + L.y + i * L.h;
      if (i === dialog.sel) {                       // 選到的那一列反白
        ctx.fillRect(f.x + L.x, y, L.w, L.h);
        ctx.fillStyle = '#fff';
      }
      ctx.fillText(n, f.x + L.x + 2, y + 1);
      ctx.fillStyle = '#111';
    });
    LOAD_BTNS.forEach(b => drawButton(f, b));
    return;
  }
  if (dialog.kind === 'confirm') {
    // Talt 1000：標題 Delete?、內文 "The file" / "^1 ?"、按鈕 OK / CANCEL
    const f = CONFIRM_FORM;
    drawFormFrame(f, 'Delete?');
    ctx.font = '10px ui-sans-serif,system-ui,sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText('The file', f.x + 6, f.y + 18);
    ctx.fillText(dialog.name + ' ?', f.x + 6, f.y + 30);
    CONFIRM_BTNS.forEach(b => drawButton(f, b));
  }
}

function btnHit(f, btns, px, py) {
  return btns.find(b => px >= f.x + b.x && px < f.x + b.x + b.w &&
                        py >= f.y + b.y && py < f.y + b.y + b.h) || null;
}

// save.c:594 按 OK：檔名不可空白，存下去然後 FrmReturnToForm(0)
function doSave(name) {
  const text = serializeSave(scene, name);
  const ok = fileWrite(name, text);
  dialog = null;
  if (!ok) { runStatus('存不進去 —— 這個瀏覽器不讓用 localStorage'); return; }
  runStatus('存成 "' + name + '"（' + text.split('\n').length + ' 行，放在瀏覽器裡）');
}

// load.c:842 CUSTOMLOAD == false 就換掉整張圖，true 就當自訂元件加進來
function doLoad(name, custom) {
  const text = fileRead(name);
  if (text === null) { runStatus('讀不到 "' + name + '"'); return; }
  try {
    if (custom) {
      makeCustomBlock(text, name);          // 先驗證讀得動
      library.set(name, text);
      renderLibrary();
      dialog = null;
      view = 'block';                       // functions.c:1041 回方塊圖
      addCustomToScene(name);               // functions.c:1040 AddCUSTtoSYSHOOK
      return;
    }
    const parsed = parseSave(text);
    killTimer(); RUN = 0; STOP = 0; ticks = 0;
    scene = parsed;
    selected = null;
    resetRun();
    syncUI();
    dialog = null;
    runStatus('載入 "' + name + '"：' + scene.wires.length + ' 條線段');
  } catch (err) {
    dialog = null;
    runStatus('讀取失敗：' + err.message);
  }
}

// 傳回 true 代表這一下被對話框吃掉了（modal，什麼都不放行）
function dialogPenDown(px, py) {
  if (!dialog) return false;
  if (dialog.kind === 'save') {
    const b = btnHit(FORM_SAVE, SAVE_BTNS, px, py);
    if (b && b.id === 'ok') { if (dialog.text.trim()) doSave(dialog.text.trim()); }
    else if (b && b.id === 'cancel') dialog = null;        // save.c:614
    render();
    return true;
  }
  if (dialog.kind === 'load') {
    const f = FORM_LOAD, L = LOAD_LIST;
    const b = btnHit(f, LOAD_BTNS, px, py);
    if (b) {
      const name = dialog.names[dialog.sel];
      if (b.id === 'cancel') dialog = null;                                    // load.c:915
      else if (b.id === 'load') { if (name != null) doLoad(name, dialog.custom); }
      else if (b.id === 'delete') { if (name != null) dialog = { kind: 'confirm', name, back: dialog }; }
      render();
      return true;
    }
    if (px >= f.x + L.x && px < f.x + L.x + L.w &&
        py >= f.y + L.y && py < f.y + L.y + L.rows * L.h) {
      const i = Math.floor((py - f.y - L.y) / L.h);
      if (i < dialog.names.length) dialog.sel = i;
    }
    render();
    return true;
  }
  if (dialog.kind === 'confirm') {
    const b = btnHit(CONFIRM_FORM, CONFIRM_BTNS, px, py);
    if (b) {
      const back = dialog.back;
      if (b.id === 'ok') fileDelete(dialog.name);         // load.c:826 FileDelete
      back.names = fileList();
      back.sel = Math.min(back.sel, back.names.length - 1);
      dialog = back;                                      // load.c:828 FrmGotoForm(LOADForm)
    }
    render();
    return true;
  }
  return false;
}

/* save.c:591 欄位是 Palm 的 Field 物件，靠 Graffiti 輸入；網頁版接實體鍵盤。
   Max Characters = 32 照資源的限制。 */
window.addEventListener('keydown', ev => {
  if (!dialog || dialog.kind !== 'save') return;
  if (ev.key === 'Enter') { if (dialog.text.trim()) doSave(dialog.text.trim()); }
  else if (ev.key === 'Escape') dialog = null;
  else if (ev.key === 'Backspace') dialog.text = dialog.text.slice(0, -1);
  else if (ev.key.length === 1 && dialog.text.length < 32) dialog.text += ev.key;
  else return;
  ev.preventDefault();
  render();
});

function popupHit(px, py) {
  if (!popup) return -2;
  const f = popup.kind === 'tools' ? FORM_TOOLS : FORM_FUNCTIONS;
  if (px < f.x || px >= f.x + f.w || py < f.y || py >= f.y + f.h) return -2;   // 點在視窗外
  const items = popupItems();
  if (popup.kind === 'tools') {
    for (let i = 0; i < items.length; i++) {
      const y = f.y + 16 + i * 18;
      if (px >= f.x + 11 && px < f.x + 29 && py >= y && py < y + 18) return i;
    }
    return -1;
  }
  for (let i = 0; i < items.length; i++) {
    const s = paletteSlot(i);
    const x = f.x + s.x, y = f.y + s.y;
    if (px >= x && px < x + (items[i].w || 32) && py >= y && py < y + (items[i].h || 32)) return i;
  }
  return -1;
}

/* functions.c:545 AddToSYSHOOK —— 從面板挑一個元件，實例化成真的方塊。
   IO 節點的配置全部照原始碼，位置一律先放在 (10,20)。 */
function addToSysHook(spec) {
  const io = (TYPE, TL, EXT, ID, BYTES = 2) =>
    ({ ID, TYPE, NotReady: false, BYTES, value: 0, TL, EXT });
  const P = (x, y) => ({ x, y });
  const XY = P(10, 20), SIZE = P(spec.w, spec.h);
  const ctrl = (spec.ctrl || []).map(c => ({ ID: c.ID, TL: P(c.x, c.y), EXT: P(c.w, c.h) }));
  const bmp = spec.bmp;
  let b;

  if (bmp === B.FORLOOPBitmap || bmp === B.WHILELOOPBitmap) {
    b = block(LOOPBLOCK, bmp, XY, SIZE, {
      ctrl: ctrl.length ? ctrl : [{ ID: 1, TL: P(25, 25), EXT: P(7, 7) }],
      hooks: [{ name: null, blocks: [], wires: [] }],
    });
    if (bmp === B.FORLOOPBitmap) {
      // functions.c:830 迴圈的兩個預設元件 N 和 I，值是 4 bytes 的 long
      const N = block(CTRLBLOCK, B.FORLOOPNBitmap, P(0, 5), P(10, 10),
        { io: [io(1, P(0, 0), P(10, 10), 0, 4)] });
      const I = block(CTRLBLOCK, B.FORLOOPIBitmap, P(0, 17), P(10, 10),
        { io: [io(0, P(0, 0), P(10, 10), 0, 4)] });
      b.hooks[0].blocks.push(N, I);
    } else {
      // functions.c:881 while 迴圈的條件元件
      const C = block(CTRLBLOCK, B.WHILELOOPLOOPBitmap, P(SIZE.x - 10, SIZE.y - 18), P(10, 10),
        { io: [io(1, P(0, 0), P(10, 10), 0)] });
      b.hooks[0].blocks.push(C);
    }
  } else if (bmp === B.SWITCHCASEBitmap) {
    b = block(CASEBLOCK, bmp, XY, SIZE, {
      ctrl: [
        { ID: 1 /*DRAGNODE*/, TL: P(25, 25), EXT: P(7, 7) },
        { ID: 2 /*SCPAGEUP*/, TL: P(25, 1), EXT: P(6, 13) },
        { ID: 3 /*SCPAGEDOWN*/, TL: P(1, 1), EXT: P(6, 13) },
      ],
      hooks: [{ name: 'true', blocks: [], wires: [] }, { name: 'false', blocks: [], wires: [] }],
    });
  } else {
    let nodes = [];
    switch (bmp) {
      case B.ADDBitmap: case B.SUBBitmap: case B.MULBitmap: case B.DIVBitmap:
      case B.ANDBitmap: case B.ORBitmap:
      case B.ABOVEBitmap: case B.LESSBitmap: case B.EQUBitmap:
      case B.ABOVEEQUBitmap: case B.LESSEQUBitmap:
        // functions.c:737 兩個輸入疊在左半邊，一個輸出佔右半邊
        nodes = [io(1, P(0, 0), P(8, 8), 0), io(1, P(0, 8), P(8, 8), 1), io(0, P(8, 0), P(8, 16), 2)];
        break;
      case B.NOTBitmap:
        nodes = [io(1, P(0, 0), P(8, 16), 0), io(0, P(8, 0), P(8, 16), 1)];
        break;
      case B.INDICATOR8BLOCKBitmap: case B.LOGICINDICATORBitmap:
        nodes = [io(1, P(0, 0), P(32, 16), 0)];
        break;
      case B.CTRLU8BLOCKBitmap: case B.LOGICCTRLBitmap:
        nodes = [io(0, P(0, 0), P(32, 16), 0)];
        break;
    }
    const opt = { io: nodes };
    if (spec.pap) {
      opt.pap = spec.pap.bmp === B.CTRLU8Bitmap ? panelCtrl(P(10, 20))
        : { BITMAPID: spec.pap.bmp, XY: P(10, 20), SIZE: P(spec.pap.w, spec.pap.h), CTRLNodeLLHead: [] };
    }
    b = block(FUNCBLOCK, bmp, XY, SIZE, opt);
  }

  b.parent = null;
  scene.blocks.push(b);
  linkParents(scene.blocks);
  resetRun();
  return b;
}

/* ==========================================================================
   編輯工具 —— 接線（THREAD）、剪線（SCISSOR）、刪除（KILL）
   對應 Src/block.c 的 BlockpenDownProcess 那一大段。
   ========================================================================== */

let wireStart = null;   // block.c 的公共變數 WireStart
let hoverNode = null;   // 拉線時筆下的節點，misc.c:368 會把它反白
let penPos = null;      // 拉線時筆的位置，畫預覽線用

// block.c:2049 執行中不可編輯：一動編輯工具就強制停止
function stopForEdit() {
  if (RUN === 0) return false;
  killTimer(); RUN = 0; STOP = 0; RUNFOREVER = false;
  runStatus('執行中不可編輯，已停止');
  return true;
}

// 找出點到哪個 IO 節點。節點的位置是元件位置加上節點的相對位移。
function nodeHit(blocks, px, py) {
  for (let i = blocks.length - 1; i >= 0; i--) {
    const b = blocks[i];
    for (const h of b.hooks || []) {
      if (b.TYPE === HOOKBLOCK) continue;      // 自訂元件是個黑盒子，不鑽進去
      if (b.TYPE === CASEBLOCK && h !== b.hooks[b.CurrentHOOK]) continue;
      const inner = nodeHit(h.blocks, px, py);
      if (inner) return inner;
    }
    const o = absOrigin(b);
    for (const n of b.bap.IONodeLLHead) {
      const x = o.x + b.bap.XY.x + n.TL.x, y = o.y + b.bap.XY.y + n.TL.y;
      if (px >= x && px < x + n.EXT.x && py >= y && py < y + n.EXT.y) return { block: b, node: n };
    }
  }
  return null;
}

// misc.c:143 CheckOnCTRLNode —— 找出點到元件上的哪個控制點
function ctrlHit(blocks, px, py) {
  for (let i = blocks.length - 1; i >= 0; i--) {
    const b = blocks[i];
    for (const h of b.hooks || []) {
      if (b.TYPE === HOOKBLOCK) continue;      // 自訂元件是個黑盒子，不鑽進去
      if (b.TYPE === CASEBLOCK && h !== b.hooks[b.CurrentHOOK]) continue;
      const inner = ctrlHit(h.blocks, px, py);
      if (inner) return inner;
    }
    const o = absOrigin(b);
    for (const n of b.bap.CTRLNodeLLHead || []) {
      const x = o.x + b.bap.XY.x + n.TL.x, y = o.y + b.bap.XY.y + n.TL.y;
      if (px >= x && px < x + n.EXT.x && py >= y && py < y + n.EXT.y) return { block: b, node: n };
    }
  }
  return null;
}

/* block.c:2743 改完大小之後，控制點要跟到新的右下角 */
function relocateCtrlNodes(b) {
  for (const n of b.bap.CTRLNodeLLHead || []) {
    if (n.ID === 1 /*DRAGNODE*/) {
      n.TL.x = b.bap.SIZE.x - n.EXT.x;
      n.TL.y = b.bap.SIZE.y - n.EXT.y;
    } else if (n.ID === 2 /*SCPAGEUP*/) {
      n.TL.x = b.bap.SIZE.x - n.EXT.x;
    }
    // SCPAGEDOWN 在左上角，不用動
  }
  /* block.c:2567「5-18 修改輸出節點位置」—— 邊框上的輸出節點（TYPE 0）貼在
     右邊，改完寬度要跟著搬。輸入節點（TYPE 1）在左邊 x=0，不用動；y 也不動，
     跟原版一樣照著內部元件當初的位置。 */
  for (const n of b.bap.IONodeLLHead || []) {
    if (n.TYPE === 0) n.TL.x = b.bap.SIZE.x - 6;
  }
}

// 一個方塊所屬的線段串列（它父層的 hook；沒有父層就是最外層）
function scopeOf(block) {
  const p = block.parent;
  if (!p) return scene;
  return p.hooks[p.TYPE === CASEBLOCK ? p.CurrentHOOK : 0];
}
function depthOf(block) { let d = 0; for (let p = block.parent; p; p = p.parent) d++; return d; }

/* block.c:1582「輸出不可接在一起」的判斷要站在**線段將來所在的那一層**去看。

   結構元件邊框上的 IO 點角色是會對調的 —— run.c:1115 DoRun_LOOPBLOCK 進去
   之前把 IONodeLLHead 的 TYPE 全翻一次，從外面看是輸出的點，站在迴圈裡面
   看就是輸入。所以「迴圈裡的 i（輸出）接到邊框上的輸出點」其實是合法的，
   那正是把值送出迴圈的作法；照節點上記的 TYPE 直接比就會被誤擋。

   原版有同樣的判斷，但原版的邊框節點只能由 CrossWire 自動長出來、使用者
   碰不到，所以踩不到；網頁版可以手動接，就得補上這個換算。 */
function effectiveType(end, other) {
  const flipped = end.block === other.block.parent;      // end 是 other 的父結構
  return flipped ? (end.node.TYPE === 1 ? 0 : 1) : end.node.TYPE;
}

function makeWire(a, b) {
  return {
    StartBlockP: a.block, StartNodeP: a.node,
    EndBlockP: b.block, EndNodeP: b.node,
    DIRTY: false, STARTRUN: false, RUNSEG: 0, RUNPOINT: { x: 0, y: 0 },
  };
}

/* block.c:1206 CrossWire —— 跨越結構邊界的資料流

   結構元件（迴圈、switch case、自訂元件）是一道邊界，線不能直接穿過去。
   真正發生的事情是：把比較深的那一端「往外提」一層 —— 在那個結構的邊框上
   長出一個 5×5 的 IO 節點，並在結構自己的 hook 裡補一段線把節點接到內部的
   元件；然後那一端就變成了邊框上的節點。重複到兩端同層，最後把剩下的那段
   接起來。

   執行時，`DoRun_LOOPBLOCK` / `DoRun_HOOKBLOCK` 的 IO 點角色對調
   （從外面看是輸入、站在裡面看就是輸出）就是讓資料真的穿過這道邊界的手法。 */
function crossWire(start, end) {
  // block.c:1221 先讓 start 一定是輸出側（資料的來源）
  if (end.node.TYPE === 0) { const t = start; start = end; end = t; }

  let guard = 0;
  while (start.block.parent !== end.block.parent && guard++ < 32) {
    const startDeeper = depthOf(start.block) > depthOf(end.block);
    const struct = startDeeper ? start.block.parent : end.block.parent;
    if (!struct || !struct.hooks) break;

    const inner = startDeeper ? start.block : end.block;
    const maxID = struct.bap.IONodeLLHead.reduce((m, n) => Math.max(m, n.ID), -1);
    /* block.c:1336 節點的方向由哪一端比較深決定：資料要出來就是輸出、
       要進去就是輸入。邊也跟著 —— 出去走右邊，進來走左邊。 */
    const node = {
      ID: maxID + 1,
      TYPE: startDeeper ? 0 : 1,
      NotReady: true, BYTES: 2, value: 0,
      TL: { x: startDeeper ? struct.bap.SIZE.x - 6 : 0, y: inner.bap.XY.y },
      EXT: { x: 5, y: 5 },
    };
    struct.bap.IONodeLLHead.push(node);

    const border = { block: struct, node };
    const innerScope = struct.hooks[struct.TYPE === CASEBLOCK ? struct.CurrentHOOK : 0];
    innerScope.wires.push(startDeeper ? makeWire(start, border) : makeWire(border, end));

    if (startDeeper) start = border; else end = border;
  }

  scopeOf(start.block).wires.push(makeWire(start, end));
}

function addWire(a, b) {
  const pa = a.block.parent, pb = b.block.parent;

  if (pa === pb) {
    // 同一層，直接放進共同的父層（block.c:1493）
    scopeOf(a.block).wires.push(makeWire(a, b));
  } else if (a.block === pb || b.block === pa) {
    /* 一端是結構元件本身、另一端在它裡面（block.c:1503）。
       線要放進那個結構自己的 hook，不是它所在的那一層。 */
    const struct = a.block === pb ? a.block : b.block;
    struct.hooks[struct.TYPE === CASEBLOCK ? struct.CurrentHOOK : 0].wires.push(makeWire(a, b));
  } else {
    crossWire(a, b);
  }
  resetRun();
}

// 剪刀：找出點在哪條線段上（用三段折線逐段算距離）
function wireHit(scope, px, py) {
  for (const w of scope.wires) {
    const s = nodeCenter(w.StartBlockP, w.StartNodeP);
    const e = nodeCenter(w.EndBlockP, w.EndNodeP);
    const [t1, t2] = turnLine(s, e);
    const segs = [[s, t1], [t1, t2], [t2, e]];
    for (const [p, q] of segs) {
      const near = px >= Math.min(p.x, q.x) - 2 && px <= Math.max(p.x, q.x) + 2 &&
                   py >= Math.min(p.y, q.y) - 2 && py <= Math.max(p.y, q.y) + 2;
      if (near) return { scope, wire: w };
    }
  }
  for (const b of scope.blocks) {
    for (const h of b.hooks || []) {
      if (b.TYPE === HOOKBLOCK) continue;      // 自訂元件是個黑盒子，不鑽進去
      if (b.TYPE === CASEBLOCK && h !== b.hooks[b.CurrentHOOK]) continue;
      const hit = wireHit(h, px, py);
      if (hit) return hit;
    }
  }
  return null;
}

// block.c:1693 BreakWireConnection —— 刪元件之前要先拆掉接在它身上的線
function removeBlock(scope, target) {
  const strip = sc => {
    sc.wires = sc.wires.filter(w => w.StartBlockP !== target && w.EndBlockP !== target);
    for (const b of sc.blocks) for (const h of b.hooks || []) strip(h);
  };
  strip(scene);
  const drop = sc => {
    const i = sc.blocks.indexOf(target);
    if (i >= 0) { sc.blocks.splice(i, 1); return true; }
    for (const b of sc.blocks) for (const h of b.hooks || []) if (drop(h)) return true;
    return false;
  };
  drop(scene);
  resetRun();
}

/* ==========================================================================
   工具列 — 對應 Src/block.c:1166 與 Src/panel.c:340

   這排圖示是畫在 160x160 螢幕裡面的，不是外掛的介面。位置寫死在原始碼裡：
   x = 40 / 60 / 80 / 100 / 120 各 16x16，140 是 18x18 的工具指標。
   狀態變數的定義在 mbcwjfx.c:63 —— STOP 是「0=無用 1=可用 2=停止」，
   RUN 是「0=靜止 1=執行 2=暫停」。
   ========================================================================== */

const TOOLBAR_H = 18;   // misc.c:800 PointIconYExt，筆點座標被夾在這條線以下

// block.c:2008 標題頁籤，點了就切換 form。判定區就是這個大小。
const TITLE_TAB = { x: 0, y: 0, w: 33, h: 15 };

function drawToolbar() {
  // Palm 的表單標題：黑底白字的頁籤
  const label = view === 'panel' ? 'Panel' : 'Block';
  ctx.fillRect(TITLE_TAB.x, TITLE_TAB.y, TITLE_TAB.w, TITLE_TAB.h - 1);
  ctx.font = 'bold 9px ui-sans-serif,system-ui,sans-serif';
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.fillText(label, 3, 2);
  ctx.fillStyle = '#111';

  icon(RUNFOREVER ? B.RUNRUNBitmap : B.RUNRUNWAITBitmap, 40, 0);
  icon(RUN === 2 ? B.PAUSEBitmap : RUN === 1 ? B.RUNBitmap : B.RUNWAITBitmap, 60, 0);
  icon(STOP === 2 ? B.STOPBitmap : STOP === 0 ? B.STOPUNUSEBitmap : B.STOPWAITBitmap, 80, 0);
  icon(LAMP ? B.LAMPLIGHTBitmap : B.LAMPBitmap, 100, 0);
  icon(B.ADDBitmap, 120, 0);                        // 元件面板（尚未實作）
  icon(pointerStateGet(), view === 'panel' ? 142 : 140, 0);
}

// block.c:1934 PenDownInBlockToolArea / panel.c:408 PenDownInPanelToolArea
function toolbarHit(px, py) {
  const at = (x, w, h) => px >= x && px < x + w && py >= 0 && py < h;
  if (at(TITLE_TAB.x, TITLE_TAB.w, TITLE_TAB.h)) return 'title';   // block.c:2008
  if (at(140, 18, 18)) return 'tools';
  if (at(120, 16, 16)) return 'functions';
  if (at(100, 16, 16)) return 'lamp';
  if (at(80, 16, 16)) return 'stop';
  if (at(60, 16, 16)) return 'run';
  if (at(40, 16, 16)) return 'forever';
  return null;
}

/* ==========================================================================
   前面板 — 對應 Src/panel.c

   同一個元件有兩種外觀：bap 畫在方塊圖上（「程式」那一面），pap 畫在前面板
   上（「使用者介面」那一面）。這是 LabVIEW 的 front panel 概念。
   面板座標是絕對值，巢狀元件也一樣 —— DrawPanel() 遞迴進迴圈時並沒有加上
   位移（panel.c:257），所以迴圈裡的控制鈕在面板上是獨立擺放的。
   ========================================================================== */

// panel.c:108 ValueDisplay
function valueDisplay(b) {
  const v = b.bap.IONodeLLHead[0] ? b.bap.IONodeLLHead[0].value | 0 : 0;
  switch (b.pap.BITMAPID) {
    case B.CTRLU8Bitmap:
    case B.INDICATOR8Bitmap:
      ctx.font = '9px ui-monospace,Consolas,monospace';
      ctx.textBaseline = 'top';
      ctx.fillText(String(v), b.pap.XY.x + 3, b.pap.XY.y + 3);
      break;
    case B.LEDOFFBitmap:
    case B.LEDONBitmap:
      // LED 是靠換圖來亮／滅的，值本身就決定用哪張圖
      b.pap.BITMAPID = v ? B.LEDONBitmap : B.LEDOFFBitmap;
      icon(b.pap.BITMAPID, b.pap.XY.x, b.pap.XY.y);
      break;
  }
}

/* misc.c:854 DrawDecimalIntKeyboard —— 面板上的數字鍵盤
   30x60，每格 10x12，5 列 3 行。按鍵順序就是原始碼裡那個陣列：
   1 2 3 / 4 5 6 / 7 8 9 / 0 c E / - (空) (空)
   c = 清除、E = Enter、- = 正負號。 */
const KEYS = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', 'c', 'E', '-', '', ''];
let keyboardObject = null;   // misc.c 的公共變數 KeyboardObject
let keyboardText = '';

// misc.c:316 鍵盤放在元件下面，位置不夠就改放上面
function keyboardXY(b) {
  const y = b.pap.XY.y + b.pap.SIZE.y + 60 > 160 ? b.pap.XY.y - 60 : b.pap.XY.y + b.pap.SIZE.y;
  return { x: b.pap.XY.x, y };
}

function drawKeyboard() {
  if (!keyboardObject) return;
  const { x, y } = keyboardXY(keyboardObject);
  eraseRect(x, y, 31, 61);
  line(x, y, x + 30, y);
  line(x + 30, y, x + 30, y + 60);
  line(x + 30, y + 60, x, y + 60);
  line(x, y + 60, x, y);
  ctx.font = 'bold 9px ui-monospace,Consolas,monospace';
  ctx.textBaseline = 'top';
  KEYS.forEach((k, i) => {
    if (!k) return;
    ctx.fillText(k, x + (i % 3) * 10 + 3, y + Math.floor(i / 3) * 12 + 1);
  });
  // 原版沒有這個：把正在輸入的數字顯示出來，否則按了看不出結果
  if (keyboardText) {
    const w = ctx.measureText(keyboardText).width;
    eraseRect(x + 31, y, w + 3, 11);
    ctx.fillText(keyboardText, x + 33, y + 1);
  }
}

// misc.c:929 KeyboardPendownProcess
function keyboardHit(px, py) {
  if (!keyboardObject) return false;
  const { x, y } = keyboardXY(keyboardObject);
  if (px < x || px >= x + 30 || py < y || py >= y + 60) return false;
  const k = KEYS[Math.floor((py - y) / 12) * 3 + Math.floor((px - x) / 10)];
  if (k === undefined || k === '') return true;

  const io = keyboardObject.bap.IONodeLLHead[0];
  if (k === 'c') keyboardText = '';
  else if (k === '-') keyboardText = keyboardText.startsWith('-') ? keyboardText.slice(1) : '-' + keyboardText;
  else if (k === 'E') {
    if (io) io.value = to16(parseInt(keyboardText, 10) || 0);
    keyboardObject = null;
    keyboardText = '';
    resetRun();
  } else keyboardText += k;
  return true;
}

// panel.c:239 DrawPanel
function drawPanel(blocks) {
  for (const b of blocks) {
    switch (b.bap.BITMAPID) {
      case B.SWITCHCASEBitmap:
        break;                                     // panel.c:255 switch case 不上面板
      case B.FORLOOPBitmap:
      case B.WHILELOOPBitmap:
        if (b.hooks) drawPanel(b.hooks[0].blocks);  // 迴圈內的元件也要出現
        break;
      default:
        if (!b.pap) break;
        if (opts.showId) {                          // panel.c:279 ID 標在元件上方
          ctx.font = '8px ui-monospace,Consolas,monospace';
          ctx.textBaseline = 'top';
          ctx.fillText(String(b.ID), b.pap.XY.x, b.pap.XY.y - 10);
        }
        icon(b.pap.BITMAPID, b.pap.XY.x, b.pap.XY.y);
        valueDisplay(b);
        if (b.pap.DrawBorder) rect(b.pap.XY.x - 1, b.pap.XY.y - 1, b.pap.SIZE.x + 3, b.pap.SIZE.y + 3);
    }
  }
}

// panel.c:312 鍵盤是整個面板畫完之後才疊上去的
function drawPanelView(blocks) {
  drawPanel(blocks);
  drawKeyboard();
}

// panel.c:367 ChangeControl —— 面板上按下去會改動元件的值
function changeControl(b, node) {
  const io = b.bap.IONodeLLHead[0];
  if (!io) return;
  switch (b.pap.BITMAPID) {
    case B.CTRLU8Bitmap:
      if (node.ID === 4 /*CONTROLUP*/) io.value = to16(io.value + 1);
      if (node.ID === 5 /*CONTROLDOWN*/) io.value = to16(io.value - 1);
      break;
    case B.SWOFFBitmap: io.value = 1; b.pap.BITMAPID = B.SWONBitmap; break;
    case B.SWONBitmap:  io.value = 0; b.pap.BITMAPID = B.SWOFFBitmap; break;
  }
}

// 面板上的點擊：先找到元件，再看有沒有落在某個控制點上
function panelHit(blocks, px, py) {
  for (const b of blocks) {
    if (b.bap.BITMAPID === B.FORLOOPBitmap || b.bap.BITMAPID === B.WHILELOOPBitmap) {
      if (b.hooks) { const hit = panelHit(b.hooks[0].blocks, px, py); if (hit) return hit; }
      continue;
    }
    if (b.bap.BITMAPID === B.SWITCHCASEBitmap || !b.pap) continue;
    const { XY, SIZE } = b.pap;
    if (px < XY.x || px >= XY.x + SIZE.x || py < XY.y || py >= XY.y + SIZE.y) continue;
    const node = (b.pap.CTRLNodeLLHead || []).find(n =>
      px >= XY.x + n.TL.x && px < XY.x + n.TL.x + n.EXT.x &&
      py >= XY.y + n.TL.y && py < XY.y + n.TL.y + n.EXT.y);
    return { block: b, node };
  }
  return null;
}

/* misc.c:368 CheckOnNode(Draw=true) —— 拉線時把筆下的節點反白成實心方塊。
   起點也一起標出來，這樣才看得出線是從哪拉到哪。 */
function drawNodeHighlight() {
  /* 拉線的預覽線。原版 mbcwjfx.c.BAK:1617-1638 寫過這段（從 WireStart 的
     節點畫到 WireStop 的節點），但整段被註解掉了；現在這版的 block.c 裡
     已經沒有這段程式。這裡把它接回來 —— 筆下有合法節點就吸附到那個節點，
     否則跟著筆走。 */
  if (wireStart && penPos) {
    const a = nodeCenter(wireStart.block, wireStart.node);
    const b = hoverNode ? nodeCenter(hoverNode.block, hoverNode.node) : penPos;
    ctx.save();
    ctx.setLineDash([2, 2]);
    line(a.x, a.y, b.x, b.y);
    ctx.restore();
  }
  for (const h of [wireStart, hoverNode]) {
    if (!h) continue;
    const o = absOrigin(h.block);
    ctx.fillRect(o.x + h.block.bap.XY.x + h.node.TL.x, o.y + h.block.bap.XY.y + h.node.TL.y,
                 h.node.EXT.x, h.node.EXT.y);
  }
}

/* block.c:529 執行點畫成 5x5 的方塊（Palm 的 WinDrawRectangle 是實心的）。
   座標已經是絕對值，所以不跟著 drawDiagram 的 window 位移。 */
function drawRunPoints(blocks, wires) {
  for (const w of wires) {
    if (w.RUNPOINT && w.STARTRUN) ctx.fillRect(w.RUNPOINT.x - 2, w.RUNPOINT.y - 2, 5, 5);
  }
  for (const b of blocks) {
    for (const h of b.hooks || []) {
      if (b.TYPE === HOOKBLOCK) continue;
      if (b.TYPE === CASEBLOCK && h !== b.hooks[b.CurrentHOOK]) continue;
      drawRunPoints(h.blocks, h.wires);
    }
  }
}

function render() {
  ctx.fillStyle = ctx.strokeStyle = '#111';
  ctx.lineWidth = 1;
  eraseRect(0, 0, cv.width, cv.height);

  if (opts.showGrid) {
    ctx.save();
    ctx.strokeStyle = 'rgba(0,0,0,.13)';
    for (let i = 16; i < 160; i += 16) { line(i, 0, i, 159); line(0, i, 159, i); }
    ctx.restore();
  }
  if (view === 'panel') {
    drawPanelView(scene.blocks);
  } else {
    drawDiagram(scene.blocks, scene.wires, 0, 0);
    if (LAMP) drawRunPoints(scene.blocks, scene.wires);
    drawNodeHighlight();
  }
  drawToolbar();     // block.c:1166 工具列是最後畫的，蓋在圖上面
  drawPopup();       // 彈出視窗又蓋在工具列上面
  drawMenu();        // 選單再蓋在彈出視窗上面
  drawDialog();      // SAVEForm / LOADForm 是 modal，蓋在選單上面
  drawAbout();       // AboutForm 也是 modal，整片蓋掉
  renderTree();
}

/* ========================= 側邊的結構樹 ========================= */
const TYPE_NAME = { 1: 'HOOKBLOCK', 2: 'FUNCBLOCK', 3: 'LOOPBLOCK', 4: 'CASEBLOCK', 5: 'CTRLBLOCK' };

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderTree() {
  const out = [];
  const walk = (blocks, depth) => {
    for (const b of blocks) {
      const pad = '  '.repeat(depth);
      const nm = ((SPRITES[b.bap.BITMAPID] || {}).n || '?').replace(/Bitmap$/, '');
      // INodeNUM / ONodeNUM 是 run.c 的執行計數器，-1 代表沒有那一種節點
      const cnt = b.bap.INodeNUM === undefined ? ''
        : `  in:${b.bap.INodeNUM} out:${b.bap.ONodeNUM}`;
      const label = esc(`${pad}#${b.ID} ${nm}${cnt}`);
      out.push(b === selected ? `<span class="sel">${label}</span>` : label);
      for (const n of b.bap.IONodeLLHead) {
        // NotReady 為 false 才是資料備妥，所以 ● 表示可用、○ 表示還在等
        out.push(esc(`${pad}   ${n.NotReady ? '○' : '●'} `
          + `${n.TYPE === 1 ? 'in ' : 'out'}[${n.ID}] = ${n.value | 0}`));
      }
      for (const h of b.hooks || []) {
        if (b.TYPE === CASEBLOCK && h !== b.hooks[b.CurrentHOOK]) continue;
        if (h.name) out.push(esc(`${pad}  case "${h.name}"`));
        walk(h.blocks, depth + (h.name ? 2 : 1));
      }
    }
  };
  walk(scene.blocks, 0);
  out.push('', esc(`線段 ${scene.wires.length} 條`));
  document.getElementById('tree').innerHTML = out.join('\n');
}

/* ==========================================================================
   執行引擎 — 對應 Src/run.c

   這是資料流（dataflow）模型，不是指令流：沒有程式計數器，只有「哪個節點
   的資料備妥了」。每個 IO 節點有一個 NotReady 旗標，每次 tick 做兩件事 ——
   先把備妥的資料沿線段搬到對面（DoRun_WireRun），再讓輸入到齊的元件計算
   （DoRun_BlockRun）。tick 回傳 handle：true 表示還有事情沒做完。

   速度最佳化靠 INodeNUM / ONodeNUM 兩個計數器（原始碼 6-3 那次改版）：
   輸入全部到齊 = INodeNUM 歸零，輸出還有沒算的 = ONodeNUM 不為零。
   兩個計數器為 0 時會被設成 -1，代表「這個元件根本沒有輸入／輸出」。
   ========================================================================== */

const to16 = v => (v << 16) >> 16;          // Palm 的 int 是 16 bit

// block.c:1949 的燈泡按鈕：開著就跑線段動畫，關著資料一次搬到位
let LAMP = false;

// run.c:63 CheckConnection —— 重算 IO 計數並設定初始的 NotReady 狀態
function checkConnection(blocks, ioBlockClear) {
  for (const b of blocks) {
    const io = b.bap.IONodeLLHead;
    b.bap.INodeNUM = io.filter(n => n.TYPE === 1).length || -1;
    b.bap.ONodeNUM = io.filter(n => n.TYPE === 0).length || -1;
    const all = ready => { for (const n of io) n.NotReady = ready; };

    switch (b.bap.BITMAPID) {
      case B.CTRLU8BLOCKBitmap:
      case B.LOGICCTRLBitmap:
        // 控制鈕是資料的源頭，一開始就備妥（ONodeNUM=0 表示輸出算完了）
        if (ioBlockClear) { io[0].NotReady = true; }
        else { io[0].NotReady = false; b.bap.ONodeNUM = 0; }
        break;
      case B.FORLOOPIBitmap:
        io[0].NotReady = true;
        break;
      case B.WHILELOOPBitmap:
        all(true);
        checkConnection(b.hooks[0].blocks, ioBlockClear);
        break;
      case B.FORLOOPBitmap:
        all(true);
        /* run.c:128 迴圈計數器 I 歸零。原版寫的是「迴圈內第二個元件」
           （`BlockLLHeadP->NEXTNODE`），但串列順序會被 ItemMoveToLastPosition
           打亂（同 doRunLoopBlock 的理由），動一下 N 就會變成把 N 歸零、
           迴圈直接結束。這裡一樣用 BITMAPID 認 I。 */
        {
          const ib = b.hooks[0].blocks.find(x => x.bap.BITMAPID === B.FORLOOPIBitmap);
          if (ib) ib.bap.IONodeLLHead[0].value = 0;
        }
        checkConnection(b.hooks[0].blocks, ioBlockClear);
        break;
      case B.CUSTOMBLOCKBitmap:
        all(true);
        if (b.hooks) checkConnection(b.hooks[0].blocks, true);
        break;
      case B.SWITCHCASEBitmap:
        break;
      default:
        all(true);
    }
  }
}

// run.c:24 ResetWireStatus
function resetWireStatus(blocks, wires) {
  for (const w of wires) { w.DIRTY = false; w.STARTRUN = false; w.RUNSEG = 0; w.RUNPOINT = { x: 0, y: 0 }; }
  for (const b of blocks) {
    if (b.TYPE === HOOKBLOCK || b.TYPE === LOOPBLOCK) {
      if (b.hooks) resetWireStatus(b.hooks[0].blocks, b.hooks[0].wires);
    }
  }
}

// run.c:559 MoveNodeData —— 目的端是 16 bit 就要截斷
function moveNodeData(dest, src) {
  dest.value = dest.BYTES === 2 ? to16(src.value) : src.value;
}

// run.c:198 DoItemRUN —— 元件本身的運算，全部照 IONodeLLHead 的順序取值
function doItemRun(b, blocks) {
  const io = b.bap.IONodeLLHead;
  const done = n => { n.NotReady = false; b.bap.ONodeNUM = 0; };
  const bin = f => { io[2].value = f(io[0].value, io[1].value); done(io[2]); };
  const cmp = f => { io[2].value = f(io[0].value, io[1].value) ? 1 : 0; done(io[2]); };

  switch (b.bap.BITMAPID) {
    case B.ADDBitmap: bin((a, c) => to16(a + c)); break;
    case B.SUBBitmap: bin((a, c) => to16(a - c)); break;
    case B.MULBitmap: bin((a, c) => to16(a * c)); break;
    case B.DIVBitmap: bin((a, c) => (c === 0 ? 0 : Math.trunc(a / c))); break;
    case B.ANDBitmap: bin((a, c) => a & c); break;
    case B.ORBitmap:  bin((a, c) => a | c); break;
    case B.NOTBitmap: io[1].value = io[0].value ? 0 : 1; done(io[1]); break;
    case B.ABOVEBitmap:    cmp((a, c) => a > c); break;
    case B.LESSBitmap:     cmp((a, c) => a < c); break;
    case B.EQUBitmap:      cmp((a, c) => a === c); break;
    case B.LESSEQUBitmap:  cmp((a, c) => a <= c); break;
    case B.ABOVEEQUBitmap: cmp((a, c) => a >= c); break;
    case B.FORLOOPNBitmap: {
      /* run.c:424 N 只負責把 I 的節點打開。原版寫的是「串列裡的下一個元件」
         （`BL->NEXTNODE`），但順序會被 ItemMoveToLastPosition 打亂
         （同 doRunLoopBlock / checkConnection 的理由）—— 動一下 N，N 就排到
         串列尾端，下一個是 undefined，I 永遠不會備妥，迴圈整個不動。
         再動一下 I 把它推到 N 後面又會好，這裡改成用 BITMAPID 認 I。 */
      const ib = blocks.find(x => x.bap.BITMAPID === B.FORLOOPIBitmap);
      if (ib) ib.bap.IONodeLLHead[0].NotReady = false;
      b.bap.ONodeNUM = 0;
      break;
    }
    // 顯示器、控制鈕、結構元件本身不做事
  }
}

/* block.c:363 DrawRunPointOnWire —— 線段上的執行點動畫

   這裡是整個執行流程最精巧的一段：動畫和資料搬移是連動的，不是先算完
   再放動畫。執行點每個 tick 沿線走一個像素，走到終點就把 RUNPOINT 設成
   (-1,-1)，而 doRunWireRun() 只搬「已抵達」的線段（run.c:592 的判斷）。
   所以資料是真的跟著那個點在跑。

   回傳 true 表示還有點在路上，doRun() 這一輪就先不搬資料。
   RUNPOINT 用 null 代表原版的 (-1,-1)。 */
function stepRunPoints(wires) {
  let anyMoving = false;
  let notFinish = true;

  for (const w of wires) {
    // block.c:405 動畫一律由輸出往輸入跑，方向不對就把兩端對調
    if (w.EndNodeP.TYPE === 0) {
      [w.StartBlockP, w.EndBlockP] = [w.EndBlockP, w.StartBlockP];
      [w.StartNodeP, w.EndNodeP] = [w.EndNodeP, w.StartNodeP];
    }
    if (w.DIRTY) continue;
    if (!(w.StartNodeP.NotReady === false && w.EndNodeP.NotReady === true)) continue;
    if (w.RUNPOINT === null) continue;              // 已抵達，等著被搬資料

    anyMoving = true;
    const s = nodeCenter(w.StartBlockP, w.StartNodeP);
    const e = nodeCenter(w.EndBlockP, w.EndNodeP);
    const [t1, t2] = turnLine(s, e);

    if (!w.STARTRUN) { w.STARTRUN = true; w.RUNPOINT = { x: s.x, y: s.y }; w.RUNSEG = 0; }
    const p = w.RUNPOINT;

    // 三段式走法：先水平到轉折點、再垂直、再水平到終點
    switch (w.RUNSEG) {
      case 0:
        if (p.x === t1.x && p.y === t1.y) w.RUNSEG = 1;
        else p.x += t1.x > p.x ? 1 : -1;
        break;
      case 1:
        if (p.x === t2.x && p.y === t2.y) w.RUNSEG = 2;
        else p.y += t2.y > p.y ? 1 : -1;
        break;
      case 2:
        if (p.x === e.x && p.y === e.y) w.RUNSEG = 3;
        else p.x += e.x > p.x ? 1 : -1;
        break;
    }

    if (p.x === e.x && p.y === e.y) {
      w.RUNPOINT = null;                            // 原版的 (-1,-1)
      w.STARTRUN = false;
      // 原版這個旗標是所有線段共用的：只要有一條抵達，這一輪就去搬資料，
      // 還在路上的線段下一個 tick 繼續走（block.c:544）
      notFinish = false;
    }
  }
  return anyMoving ? notFinish : false;
}

// run.c:582 DoRun_WireRun —— 資料沿線段搬移
function doRunWireRun(wires) {
  for (const w of wires) {
    if (w.DIRTY) continue;
    // run.c:592 開動畫時，只有執行點已經抵達的線段才搬資料
    if (LAMP && w.RUNPOINT !== null) continue;
    const s = w.StartNodeP, e = w.EndNodeP;

    // 輸出端備妥 -> 搬給還沒備妥的輸入端
    if (!s.NotReady && s.TYPE === 0 && e.NotReady) {
      moveNodeData(e, s); e.NotReady = false; w.EndBlockP.bap.INodeNUM--;
      if (LAMP) w.DIRTY = true;
    }
    if (!e.NotReady && e.TYPE === 0 && s.NotReady) {
      moveNodeData(s, e); s.NotReady = false; w.StartBlockP.bap.INodeNUM--;
      if (LAMP) w.DIRTY = true;
    }
    // 兩端都是輸入時（迴圈邊上會出現），備妥的那端餵給另一端
    if (s.TYPE === 1 && e.TYPE === 1) {
      if (s.NotReady && !e.NotReady) {
        moveNodeData(s, e); s.NotReady = false; w.StartBlockP.bap.INodeNUM--;
        if (LAMP) w.DIRTY = true;
      }
      if (!s.NotReady && e.NotReady) {
        moveNodeData(e, s); e.NotReady = false; w.EndBlockP.bap.INodeNUM--;
        if (LAMP) w.DIRTY = true;
      }
    }
  }
}

const inputsReady = b => b.bap.INodeNUM === 0 || b.bap.INodeNUM === -1;
const outputsPending = b => (b.bap.ONodeNUM === -1 ? true : b.bap.ONodeNUM !== 0);

// run.c:1043 DoRun_LOOPBLOCK
function doRunLoopBlock(b) {
  let handle = false;
  if (!inputsReady(b)) return true;              // 輸入還沒到齊，下次再來
  if (!outputsPending(b)) return false;          // 輸出都算完了，不用再進去

  const inner = b.hooks[0];

  /* run.c:1115 迴圈邊上的 IO 點要暫時對調角色 —— 從外面看是輸入的節點，
     站在迴圈裡面看就變成輸出。進去之前翻一次，回來再翻回來。 */
  const swap = () => {
    const t = b.bap.ONodeNUM; b.bap.ONodeNUM = b.bap.INodeNUM; b.bap.INodeNUM = t;
    for (const n of b.bap.IONodeLLHead) n.TYPE = n.TYPE === 1 ? 0 : 1;
  };

  swap();
  const innerBusy = doRun(inner.blocks, inner.wires);
  swap();

  if (innerBusy) {
    handle = true;
    for (const n of b.bap.IONodeLLHead) if (n.TYPE === 0) n.NotReady = true;
    return handle;
  }

  // 內部這一輪跑完了
  if (b.bap.ONodeNUM !== 0 && b.bap.ONodeNUM !== -1) handle = true;
  if (handle) return handle;

  /* run.c:1256 迴圈控制：決定要不要再跑一圈

     跟原版不一樣的地方：原版是拿串列的第一個和第二個元件當 N 和 I
     （`BlockLLHeadP` 跟 `BlockLLHeadP->NEXTNODE`），但點過的元件會被
     ItemMoveToLastPosition 移到串列尾端（block.c:2720），所以只要動一下
     迴圈裡的 N 或 I，順序就亂了，N/I 會抓到別的元件、迴圈就不會跑。
     這裡改成用 BITMAPID 去認人，不靠順序。 */
  const byBmp = id => inner.blocks.find(x => x.bap.BITMAPID === id) || null;
  const again = () => {
    handle = true;
    loopIterations++;          // 重跑一輪算有進展，不然 while(1) 會被熄火誤判
    checkConnection(inner.blocks, false);
    resetWireStatus(inner.blocks, inner.wires);
    for (const n of b.bap.IONodeLLHead) {
      if (n.TYPE === 0) { b.bap.ONodeNUM++; n.NotReady = true; }
    }
  };

  if (b.bap.BITMAPID === B.WHILELOOPBitmap) {
    const c = byBmp(B.WHILELOOPLOOPBitmap);
    if (!c) return handle;
    if (!c.bap.IONodeLLHead[0].NotReady && c.bap.IONodeLLHead[0].value) again();
  } else if (b.bap.BITMAPID === B.FORLOOPBitmap) {
    const nb = byBmp(B.FORLOOPNBitmap), ib = byBmp(B.FORLOOPIBitmap);
    if (!nb || !ib) return handle;
    const N = nb.bap.IONodeLLHead[0], I = ib.bap.IONodeLLHead[0];
    if (!N.NotReady) {
      if (N.value !== I.value) { again(); I.value++; }   // run.c:1326 N != I 就 I++
      else I.value = 0;                                   // 相等，迴圈結束，I 歸零
    }
  }
  return handle;
}

/* run.c:746 DoRun_HOOKBLOCK —— 自訂元件的執行

   自訂元件就是一整張存好的圖被當成一個方塊。它的 IO 點（存檔時長出來的接腳）
   透過「暗線段」連到內部的控制鈕和顯示器。執行的順序是：

     1. 把接腳上的資料沿暗線段推進去，餵給內部的控制鈕
     2. 把接腳的角色對調（跟迴圈同一招），遞迴執行內部
     3. 內部算完之後，沿暗線段把內部顯示器的值抽回接腳

   內部執行時會強制關掉動畫（run.c:869）—— 看不到的東西不需要跑動畫。 */
function findWireByNode(wires, node) {
  return wires.find(w => w.StartNodeP === node || w.EndNodeP === node) || null;
}

function doRunHookBlock(b) {
  let handle = false;
  /* 空殼：存檔對 HOOKBLOCK 只寫一行 FILENAME（save.c），內容要靠那個檔名去
     找回來（load.c:576）。找不到的話 hooks 是 null —— 不能往下走，也不能
     假裝算完了，就當它不動，讓整輪執行正常結束而不是丟例外。 */
  if (!b.hooks) return false;
  if (!inputsReady(b)) return true;
  if (!outputsPending(b)) return false;

  const inner = b.hooks[0];

  // run.c:811 把輸入接腳的值沿暗線段推給內部元件
  for (const n of b.bap.IONodeLLHead) {
    if (n.TYPE !== 1) continue;
    const w = findWireByNode(inner.wires, n);
    if (!w) continue;
    if (w.StartBlockP === b) { moveNodeData(w.EndNodeP, w.StartNodeP); w.EndNodeP.NotReady = false; }
    if (w.EndBlockP === b) { moveNodeData(w.StartNodeP, w.EndNodeP); w.StartNodeP.NotReady = false; }
    w.DIRTY = true;
  }
  // run.c:836 輸出側的暗線段也標成已處理，內部執行時不要再動它
  for (const n of b.bap.IONodeLLHead) {
    if (n.TYPE !== 0) continue;
    const w = findWireByNode(inner.wires, n);
    if (w) w.DIRTY = true;
  }

  const swap = () => {
    const t = b.bap.ONodeNUM; b.bap.ONodeNUM = b.bap.INodeNUM; b.bap.INodeNUM = t;
    for (const n of b.bap.IONodeLLHead) n.TYPE = n.TYPE === 1 ? 0 : 1;
  };

  swap();
  const lampWas = LAMP;
  LAMP = false;                       // run.c:869 內部不跑動畫
  const innerBusy = doRun(inner.blocks, inner.wires);
  LAMP = lampWas;
  swap();

  if (innerBusy) {
    handle = true;
    for (const n of b.bap.IONodeLLHead) if (n.TYPE === 0) n.NotReady = true;
    return handle;
  }

  // run.c:944 內部算完了，把結果沿暗線段抽回輸出接腳
  for (const n of b.bap.IONodeLLHead) {
    if (n.TYPE !== 0) continue;
    const w = findWireByNode(inner.wires, n);
    if (!w) continue;
    if (w.StartBlockP === b && !w.EndNodeP.NotReady) {
      moveNodeData(w.StartNodeP, w.EndNodeP); w.StartNodeP.NotReady = false; b.bap.ONodeNUM--;
    }
    if (w.EndBlockP === b && !w.StartNodeP.NotReady) {
      moveNodeData(w.EndNodeP, w.StartNodeP); w.EndNodeP.NotReady = false; b.bap.ONodeNUM--;
    }
  }
  if (b.bap.ONodeNUM !== 0 && b.bap.ONodeNUM !== -1) handle = true;
  return handle;
}

// run.c:1356 DoRun_BlockRun
function doRunBlockRun(blocks) {
  let handle = false;
  blocks.forEach((b, i) => {
    switch (b.TYPE) {
      case HOOKBLOCK:
        if (doRunHookBlock(b)) handle = true;
        break;
      case LOOPBLOCK:
        if (doRunLoopBlock(b)) handle = true;
        break;
      default:
        if (!inputsReady(b)) { handle = true; break; }
        if (outputsPending(b)) doItemRun(b, blocks);
    }
  });
  return handle;
}

// run.c:1498 DoRun —— 一次 tick。回傳 true 表示還沒跑完
function doRun(blocks, wires) {
  // run.c:1542 開動畫時先讓執行點走，走完了才搬資料、才讓元件運算
  if (LAMP && stepRunPoints(wires)) return true;
  doRunWireRun(wires);
  return doRunBlockRun(blocks);
}

/* ==========================================================================
   讀 Palm 存檔（.pdb）— 對應 Src/save.c 的 DataStruct2ASCII() 與
   Src/load.c 的 parse_loop()

   存檔內容是純 ASCII，一行關鍵字一行值，位置固定；外面包一層 Palm
   FileStream 的 PDB 容器（type 'save'、creator 'wjfx'）。
   ========================================================================== */

// PDB 表頭 78 bytes，記錄表每筆 8 bytes。Palm 的 FileStream 在記錄裡還有
// 自己的表頭，格式沒有公開文件，所以這裡直接掃 "STARTBLOCK" 取內文 ——
// 不管中間夾了什麼表頭都讀得到。
function pdbToText(buf) {
  const bytes = new Uint8Array(buf);
  let text = '';
  for (let i = 0; i < bytes.length; i++) text += String.fromCharCode(bytes[i]);
  const start = text.indexOf('STARTBLOCK');
  if (start < 0) throw new Error('這個檔案裡找不到 STARTBLOCK，不像是 MbcWJFX 的存檔');
  const end = text.lastIndexOf('ENDWIRE');
  return text.slice(start, end < 0 ? undefined : end + 'ENDWIRE'.length);
}

function parseSave(text) {
  const lines = text.split('\n').map(s => s.replace(/\r$/, ''));
  let p = 0;
  const next = () => (p < lines.length ? lines[p++] : '');
  const num = () => parseInt(next(), 10) || 0;

  // 一個 hook 的內容：STARTBLOCK…ENDBLOCK 之後跟著 STARTWIRE…ENDWIRE。
  // load.c 的 parse_loop() 就是這個結構，遇到結構元件會遞迴。
  function body() {
    while (p < lines.length && next() !== 'STARTBLOCK') { /* 找起點 */ }

    const blocks = [];
    for (;;) {
      let tok = next();                                  // NEWNODE 或 ENDBLOCK
      if (tok === 'ENDBLOCK' || tok === '') break;

      next(); const ID = num();                          // ID
      next(); const TYPE = num();                        // TYPE
      next();                                            // NEWBAP，一定有
      next(); const BITMAPID = num();
      next(); const XY = { x: num(), y: num() };
      next(); const SIZE = { x: num(), y: num() };

      const io = [], ctrl = [];
      tok = next();                                      // NEWIONODEP / NEWCTRLNODEP / ENDBAP
      if (tok === 'NEWIONODEP') {
        tok = next();
        while (tok === 'ADDIONODE') {
          next(); const nID = num();
          next(); const nTYPE = num();
          next(); const BYTES = num();
          next(); const value = num();                   // save.c 只在 BYTES 是 2/4 時寫
          next(); const TL = { x: num(), y: num() };
          next(); const EXT = { x: num(), y: num() };
          io.push({ ID: nID, TYPE: nTYPE, BYTES, value, NotReady: false, TL, EXT });
          tok = next();
        }
      }
      if (tok === 'NEWCTRLNODEP') {
        tok = next();
        while (tok === 'ADDCTRLNODE') {
          next(); const cID = num();
          next(); const TL = { x: num(), y: num() };
          next(); const EXT = { x: num(), y: num() };
          ctrl.push({ ID: cID, TL, EXT });
          tok = next();
        }
      }
      // tok 這時應該是 ENDBAP

      let pap = null;
      tok = next();                                      // NEWPAP 或下一個關鍵字
      if (tok === 'NEWPAP') {
        next(); const pBITMAPID = num();
        next(); const pXY = { x: num(), y: num() };
        next(); const pSIZE = { x: num(), y: num() };
        const pctrl = [];
        tok = next();
        if (tok === 'NEWCTRLNODEP') {
          tok = next();
          while (tok === 'ADDCTRLNODE') {
            next(); const cID = num();
            next(); const TL = { x: num(), y: num() };
            next(); const EXT = { x: num(), y: num() };
            pctrl.push({ ID: cID, TL, EXT });
            tok = next();
          }
        }
        pap = { BITMAPID: pBITMAPID, XY: pXY, SIZE: pSIZE, CTRLNodeLLHead: pctrl };
        tok = next();                                    // 跳過 ENDPAP 之後那一行
      }

      let hooks = null;
      if (tok === 'NEWLOOPHOOK') {                       // save.c:202，迴圈只有一個 hook
        next();                                          // NEWHOOK
        hooks = [{ name: null, ...body() }];
        tok = next();
      }
      if (tok === 'NEWCASEHOOK') {                       // save.c:209，switch case 有一串
        hooks = [];
        tok = next();
        while (tok === 'NEWHOOK') {
          // 存檔格式沒有寫 hook->name，原本的分頁名稱（"true"/"false"）
          // 在存檔時就遺失了，只能用序號代替。
          hooks.push({ name: 'case ' + hooks.length, ...body() });
          tok = next();
        }
      }

      let filename = null;
      if (tok === 'FILENAME') {
        filename = next();
        tok = next();
      }
      // tok 這時是 ENDNODE

      const b = {
        ID, TYPE,
        bap: { BITMAPID, XY, SIZE, IONodeLLHead: io, CTRLNodeLLHead: ctrl, DrawBorder: false },
        pap, hooks, CurrentHOOK: 0, filename, parent: null,
      };
      blocks.push(b);
      if (tok === 'ENDBLOCK') break;
    }

    while (p < lines.length && next() !== 'STARTWIRE') { /* 找線段區 */ }

    const raw = [];
    for (;;) {
      const tok = next();
      if (tok === 'ENDWIRE' || tok === '') break;
      if (tok !== 'STARTBID') continue;
      const sb = num();
      next(); const sn = num();                          // STARTNID
      next(); const eb = num();                          // ENDBID
      next(); const en = num();                          // ENDNID
      raw.push({ sb, sn, eb, en });
    }
    return { blocks, rawWires: raw };
  }

  const root = body();

  /* 線段存的是 ID，載入時要換回物件參照。load.c:686 的 FindNodeByID 會
     往結構元件內部找，所以這裡也遞迴搜。ID 1 是特例：load.c:676 把它當成
     最外層的 HOOKBLOCK（自訂元件的外框）。 */
  function findBlock(scope, id) {
    for (const b of scope) {
      if (b.ID === id) return b;
      for (const h of b.hooks || []) {
        const hit = findBlock(h.blocks, id);
        if (hit) return hit;
      }
    }
    return null;
  }
  const hookBlock = root.blocks.find(b => b.TYPE === HOOKBLOCK) || null;

  /* load.c:687 —— 找起點是 SelfBlockLLHead，也就是**擁有這個 hook 的那顆結構
     元件**，不是 hook 裡面的串列。load.c:672 的註解把兩種情況寫得很清楚：

       1. IO 點位在迴圈結構上 → 傳回 SelfBlockLLHead 自己
       2. IO 點位在迴圈結構內 → FindNodeByID 向內探尋

     第 1 種就是 block.c:1503「一端是結構元件本身、另一端在它裡面」那種線，
     還有 CrossWire 長在邊框上的節點 —— 這些線住在 hook 裡，但有一端指向
     hook 的擁有者。只從 hook 自己的串列找就會找不到，線段整條被丟掉。 */
  function resolve(scope, owner) {
    const { blocks, rawWires } = scope;
    // 自訂元件補回來的 hook：內容在它自己的存檔裡就解析完了，不用再解一次
    if (!rawWires) return;
    const searchRoot = owner ? [owner] : blocks;
    scope.wires = [];
    for (const r of rawWires) {
      const sb = (r.sb === 1 && hookBlock) ? hookBlock : findBlock(searchRoot, r.sb);
      const eb = (r.eb === 1 && hookBlock) ? hookBlock : findBlock(searchRoot, r.eb);
      if (!sb || !eb) continue;                          // 壞掉的參照就跳過，不要整個炸掉
      const sn = sb.bap.IONodeLLHead.find(n => n.ID === r.sn);
      const en = eb.bap.IONodeLLHead.find(n => n.ID === r.en);
      if (!sn || !en) continue;
      scope.wires.push({ StartBlockP: sb, StartNodeP: sn, EndBlockP: eb, EndNodeP: en, DIRTY: false });
    }
    delete scope.rawWires;
    for (const b of blocks) for (const h of b.hooks || []) resolve(h, b);
  }
  /* load.c:576 —— 有 FILENAME 而且不是最外層那顆 HOOKBLOCK 的，原版會拿那個
     檔名遞迴 LOAD() 把內容補回來。自訂元件的內容**不會**寫進使用它的存檔裡
     （save.c 對 HOOKBLOCK 只寫一行 FILENAME），元件本身是機器上另一個
     database。網頁版拿元件庫和存檔區（localStorage）當那個 database。

     load.c:601 那幾行還做了兩件事，這裡照做：
       - 接腳（IONodeLLHead）要用元件那份，因為暗線段是接在它上面的
       - 元件內部 ID 為 1 的線段端點要換成這顆方塊本身 */
  const missing = [];
  function fillCustomBlocks(blocks, depth) {
    for (const b of blocks) {
      for (const h of b.hooks || []) fillCustomBlocks(h.blocks, depth);
